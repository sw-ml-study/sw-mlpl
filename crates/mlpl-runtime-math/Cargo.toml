[package]
name = "mlpl-runtime-math"
edition.workspace = true
license.workspace = true
version.workspace = true

# Math and constructor builtins extracted from mlpl-runtime.
# Self-contained: depends on mlpl-array (for DenseArray/Shape) and
# mlpl-runtime-core (for RuntimeError). Nothing depends back
# upward from mlpl-runtime-math so the dep graph stays a DAG.

[dependencies]
mlpl-array = { path = "../../components/lang-core/crates/mlpl-array" }
mlpl-array-ops-element = { path = "../../components/lang-core/crates/mlpl-array-ops-element" }
mlpl-runtime-core = { path = "../mlpl-runtime-core" }
