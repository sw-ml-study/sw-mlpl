[package]
name = "mlpl-web-eval"
edition.workspace = true
license.workspace = true
version.workspace = true

# Saga 32 step 004: web-side eval-pipeline extracted from
# apps/mlpl-web. Hosts the 4 eval-shaped modules (eval, eval_url,
# eval_wasm, eval_sse) plus state.rs (HistoryEntry / DocTab) and
# summary.rs (numeric-output summarizer). Clean DAG leaf: no
# imports from mlpl-web crates; only external (mlpl-wasm + the
# WASM-side fetch / future stack).

[dependencies]
mlpl-wasm = { path = "../mlpl-wasm" }
gloo = { version = "0.11", features = ["net"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Window",
    "console",
] }

# Native build (test target only): the RemoteEvaluator uses
# `reqwest::blocking` against an in-process `mlpl-serve`. The
# WASM build pulls fetch via `gloo::net` instead, so this
# dependency is gated.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
