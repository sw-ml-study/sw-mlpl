[package]
name = "mlpl-runtime"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
mlpl-core = { path = "../../components/lang-core/crates/mlpl-core" }
mlpl-runtime-core = { path = "../mlpl-runtime-core" }
mlpl-runtime-math = { path = "../mlpl-runtime-math" }
mlpl-runtime-conv = { path = "../mlpl-runtime-conv" }
mlpl-runtime-rnn = { path = "../mlpl-runtime-rnn" }
mlpl-runtime-array = { path = "../mlpl-runtime-array" }
mlpl-runtime-ml = { path = "../mlpl-runtime-ml" }
mlpl-runtime-data = { path = "../mlpl-runtime-data" }
mlpl-runtime-dim-reduction = { path = "../mlpl-runtime-dim-reduction" }
mlpl-runtime-umap = { path = "../mlpl-runtime-umap" }
mlpl-runtime-mds-rp = { path = "../mlpl-runtime-mds-rp" }
mlpl-array = { path = "../mlpl-array" }
# Saga 19 step 001: `llm_call` POSTs to an Ollama-
# compatible /api/generate endpoint. ureq is pinned
# to 2.x with `default-features = false` because
# Ollama serves plain HTTP on localhost; no TLS
# needed and skipping it avoids the rustls/openssl
# dependency choice. Same pin as `apps/mlpl-repl`'s
# `:ask` command uses today.
ureq = { version = "2", default-features = false, features = ["json"] }
serde_json = "1"
