[package]
name = "mlpl-web-lessons"
edition.workspace = true
license.workspace = true
version.workspace = true

# Saga 32 step 003: tutorial-lesson static content extracted
# from apps/mlpl-web. Self-contained leaf crate: `lessons.rs`
# (basic/intermediate lessons + Lesson type), `lessons_advanced`
# (saga-era deeper lessons), and `intro_md` (the tutorial-intro
# markdown-to-html renderer). Only `yew` is external.

[dependencies]
yew = { version = "0.21", features = ["csr"] }
