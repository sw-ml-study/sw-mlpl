<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" style="background-color:white;font-family:'trebuchet ms',verdana,arial,sans-serif;font-size:12px">
  <text x="300" y="22" text-anchor="middle" font-size="16" font-weight="bold">Naive Bayes: independent per-feature evidence, multiplied</text>

  <!-- feature 1 -->
  <g transform="translate(45,60)">
    <text x="105" y="0" text-anchor="middle" font-weight="bold">feature 1 (e.g. height)</text>
    <path d="M0,90 C30,90 40,20 70,20 C100,20 110,90 140,90" fill="none" stroke="#0369a1" stroke-width="2.5"/>
    <path d="M70,90 C100,90 110,35 140,35 C170,35 180,90 210,90" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
    <line x1="0" y1="90" x2="210" y2="90" stroke="#9ca3af"/>
    <line x1="120" y1="90" x2="120" y2="12" stroke="#374151" stroke-dasharray="4 3"/>
    <text x="120" y="108" text-anchor="middle" font-family="monospace" font-size="10">x1</text>
    <text x="40" y="14" fill="#0369a1" font-size="10">class A</text>
    <text x="180" y="28" fill="#b91c1c" font-size="10">class B</text>
  </g>

  <!-- feature 2 -->
  <g transform="translate(340,60)">
    <text x="105" y="0" text-anchor="middle" font-weight="bold">feature 2 (e.g. weight)</text>
    <path d="M0,90 C30,90 40,30 70,30 C100,30 110,90 140,90" fill="none" stroke="#0369a1" stroke-width="2.5"/>
    <path d="M40,90 C70,90 80,25 110,25 C140,25 150,90 180,90" fill="none" stroke="#b91c1c" stroke-width="2.5"/>
    <line x1="0" y1="90" x2="210" y2="90" stroke="#9ca3af"/>
    <line x1="60" y1="90" x2="60" y2="12" stroke="#374151" stroke-dasharray="4 3"/>
    <text x="60" y="108" text-anchor="middle" font-family="monospace" font-size="10">x2</text>
  </g>

  <text x="300" y="200" text-anchor="middle">read each curve's height at the dashed line: that is the per-feature likelihood</text>

  <!-- combination -->
  <rect x="60" y="220" width="480" height="76" fill="#f8fafc" stroke="#9ca3af"/>
  <text x="300" y="242" text-anchor="middle" font-family="monospace" font-size="12">score(class) = P(class) * P(x1 | class) * P(x2 | class) * ...</text>
  <text x="300" y="262" text-anchor="middle">the NAIVE assumption: features are treated as independent given the class,</text>
  <text x="300" y="278" text-anchor="middle">so the joint likelihood is just a product -- one multiply per feature</text>

  <!-- verdict -->
  <rect x="140" y="316" width="140" height="52" fill="#dbeafe" stroke="#0369a1" stroke-width="2"/>
  <text x="210" y="338" text-anchor="middle" font-weight="bold" fill="#0369a1">score(A) = 0.061</text>
  <text x="210" y="356" text-anchor="middle" font-size="10">winner: argmax</text>
  <rect x="310" y="316" width="160" height="52" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="390" y="338" text-anchor="middle" font-weight="bold" fill="#b91c1c">score(B) = 0.014</text>
  <text x="390" y="356" text-anchor="middle" font-size="10">loses despite feature 2's edge</text>
</svg>
