<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" style="background-color:white;font-family:'trebuchet ms',verdana,arial,sans-serif;font-size:13px;fill:#333">
  <text x="360" y="22" text-anchor="middle" font-size="16" font-weight="bold">:upload x  --  flow from file picker to bound Result</text>

  <!-- step 1: REPL command -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="140" height="50" fill="#fef3c7" stroke="#a16207"/>
    <text x="70" y="20" text-anchor="middle" font-weight="bold">REPL :upload x</text>
    <text x="70" y="38" text-anchor="middle" font-size="11">user types it in</text>
  </g>

  <!-- step 2: file picker -->
  <g transform="translate(180,50)">
    <rect x="0" y="0" width="140" height="50" fill="#ddd6fe" stroke="#5b21b6"/>
    <text x="70" y="20" text-anchor="middle" font-weight="bold">file &lt;input&gt;</text>
    <text x="70" y="38" text-anchor="middle" font-size="11">native browser picker</text>
  </g>

  <!-- step 3: cancel branch -->
  <g transform="translate(340,50)">
    <rect x="0" y="0" width="140" height="50" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="70" y="20" text-anchor="middle" font-weight="bold">file chosen?</text>
    <text x="70" y="38" text-anchor="middle" font-size="11">cancel vs continue</text>
  </g>

  <!-- step 4: decode -->
  <g transform="translate(500,50)">
    <rect x="0" y="0" width="200" height="50" fill="#dcfce7" stroke="#15803d"/>
    <text x="100" y="20" text-anchor="middle" font-weight="bold">HTMLCanvasElement</text>
    <text x="100" y="38" text-anchor="middle" font-size="11">drawImage -&gt; getImageData</text>
  </g>

  <line x1="160" y1="75" x2="178" y2="75" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="320" y1="75" x2="338" y2="75" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="75" x2="498" y2="75" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- branch labels -->
  <g transform="translate(220,150)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#b91c1c">If user cancels</text>
    <rect x="0" y="10" width="240" height="50" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="120" y="32" text-anchor="middle" font-family="monospace" font-size="12">Err("cancelled")</text>
    <text x="120" y="50" text-anchor="middle" font-size="11">ok = false, payload Str</text>
  </g>

  <g transform="translate(220,230)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#b91c1c">If decode fails</text>
    <rect x="0" y="10" width="240" height="50" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="120" y="32" text-anchor="middle" font-family="monospace" font-size="12">Err("decode failed: ...")</text>
    <text x="120" y="50" text-anchor="middle" font-size="11">includes file format hint</text>
  </g>

  <g transform="translate(480,150)">
    <text x="0" y="0" font-size="12" font-weight="bold" fill="#15803d">On success</text>
    <rect x="0" y="10" width="220" height="130" fill="#dcfce7" stroke="#15803d"/>
    <text x="110" y="32" text-anchor="middle" font-weight="bold">Ok(Record)</text>
    <text x="10" y="52" font-family="monospace" font-size="11">{ pixels:  [3, H, W] f32 0..1,</text>
    <text x="10" y="68" font-family="monospace" font-size="11">  height:  scalar i64,</text>
    <text x="10" y="84" font-family="monospace" font-size="11">  width:   scalar i64,</text>
    <text x="10" y="100" font-family="monospace" font-size="11">  name:    Str,</text>
    <text x="10" y="116" font-family="monospace" font-size="11">  mime:    Str }</text>
    <text x="110" y="132" text-anchor="middle" font-size="11" fill="#15803d">consumer: r.pixels, r.name</text>
  </g>

  <!-- branch lines -->
  <line x1="410" y1="100" x2="340" y2="160" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <line x1="600" y1="100" x2="590" y2="160" stroke="#15803d" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="600" y1="100" x2="460" y2="240" stroke="#b91c1c" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr)"/>

  <text x="360" y="310" text-anchor="middle" font-size="11" fill="#666">Binding: x := Result; the awaited reply replaces the placeholder once the user picks (or cancels).</text>
  <text x="360" y="328" text-anchor="middle" font-size="11" fill="#666">Always-Result return shape removes the gotcha of "did this fail or did I get a tensor back?".</text>
  <text x="360" y="346" text-anchor="middle" font-size="11" font-style="italic" fill="#666">Pair with: glossary entry ":upload"; demo "Upload Result demo".</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
  </defs>
</svg>
