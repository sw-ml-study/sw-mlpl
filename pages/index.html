    <style>
        /* Catppuccin Mocha */
        :root {
            --crust: #11111b;
            --mantle: #181825;
            --base: #1e1e2e;
            --surface0: #313244;

            --lavender: #b4befe;
            --blue: #89b4fa;
            --sapphire: #74c7ec;
            --sky: #89dceb;
            --teal: #94e2d5;

        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {

            flex-direction: column;

        header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--blue);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-badge {
            height: 28px;
            width: auto;
            display: block;
        }
        .title-text {

        }
        .title-line {
            font-size: 13px;
            color: var(--overlay2);

        #app {

        /* Header tabs */
        .header-tabs {

        }
        .header-tabs .tab {

            font-size: 13px;
            cursor: pointer;
        }
        .demo-select:hover {

        .ctrl-btn {

        /* REPL output area */
        main {

            flex-direction: column;
            min-height: 0;
        }
        /* Tutorial mode: side-by-side panes so the lesson and
           the live transcript both have meaningful vertical
           space. Each pane scrolls independently. Stacks
           vertically on narrow viewports. */
        /* Saga 36: script editor */
        .editor-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        main.viz3d-split > .stage3d-pane {

        .stage3d-inspector-backdrop {

        .stage3d-nav {

        .stage3d-btn {

        }

        main.tutorial-split {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            grid-template-rows: 1fr;
            gap: 0;
            overflow: hidden;
            padding: 0;
        }
        main.tutorial-split .tutorial-pane {
            overflow: auto;
            padding: 16px 20px;
            border-right: 1px solid var(--surface1);
            min-height: 0;
        }
        main.tutorial-split .repl-pane {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;

            overflow: auto;
            padding: 16px 20px;
        }

            background: var(--green);
            color: var(--base);

            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            margin-left: auto;
        }
        .run-all-btn:hover {
            background: var(--teal);
        }
        .output {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }
        .welcome {
            color: var(--overlay2);
            margin-bottom: 16px;
        }
        .welcome p {
            margin-bottom: 4px;
        }
        .welcome code {
            color: var(--peach);
            background: var(--surface0);
            padding: 1px 6px;
            border-radius: 3px;
        }
        .entry {
            margin-bottom: 8px;
        }
        .narration {
            background: var(--surface0);
            border-left: 3px solid var(--sapphire);

            border-radius: 0 4px 4px 0;

            color: var(--sapphire);

            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .narration-body {
            color: var(--text);
            line-height: 1.5;
            font-size: 14px;
        }
        .input-line {
            color: var(--text);
        }
        .prompt {
            color: var(--green);
            font-weight: 700;
        }
        .line-comment {
            color: var(--subtext0);
            font-style: italic;
            opacity: 0.85;
        }
        .output-line {
            color: var(--subtext1);
            white-space: pre;
            margin-left: 0;
            font-family: var(--mono);
            font-size: 15px;
        }
        .output-line.error {
            color: var(--red);
        }
        /* Saga 29 step 018: "this line is running" placeholder.
           The CSS animation runs on the browser compositor
           thread, so the spinner keeps turning even while the
           WASM eval blocks the main JS thread. */
        .entry.running {
            opacity: 0.85;
        }
        .running-line {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--yellow);
        }
        .running-text {
            font-style: italic;
        }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--surface2);
            border-top-color: var(--yellow);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .output-summary {
            margin: 2px 0 8px 0;
        }
        .output-summary > summary {
            color: var(--sapphire);
            cursor: pointer;
            font-family: var(--mono);
            font-size: 15px;
            list-style: none;
            padding: 2px 0;
        }
        .output-summary > summary::-webkit-details-marker {
            display: none;
        }
        .output-summary > summary::before {
            content: "\25b8  ";
            color: var(--overlay2);
            display: inline-block;
            width: 1em;
        }
        .output-summary[open] > summary::before {
            content: "\25be  ";
        }
        .output-summary > summary:hover {
            color: var(--blue);
        }
        .output-summary > pre {
            margin-top: 4px;
            padding-left: 1.25em;
            border-left: 2px solid var(--surface1);
        }
        .svg-output {
            display: inline-block;
            position: relative;
            background: var(--mantle);
            border: 1px solid var(--surface1);
            border-radius: 6px;
            padding: 10px;
            margin: 6px 0;
        }
        .svg-download {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--surface0);
            border: 1px solid var(--surface1);
            border-radius: 4px;
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            opacity: 0.6;
            transition: opacity 0.15s;
        }
        .svg-download:hover {
            opacity: 1;
        }
        .svg-output svg {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* Input row */
        .input-wrap {
            border-top: 1px solid var(--surface1);
            background: var(--mantle);
            flex-shrink: 0;
        }
        .session-label {
            padding: 4px 20px 0;
            font-family: var(--mono);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .session-label.repl {
            color: var(--green);
        }
        .session-label.tutorial {
            color: var(--peach);
        }
        .input-row {
            display: flex;
            align-items: center;
            padding: 4px 20px 12px;
            flex-shrink: 0;
        }
        .input-row input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: var(--mono);
            font-size: 15px;
            margin-left: 4px;
        }

           into the input row so it lives where the output lives.
           Sized down a bit since it shares the row with the prompt. */
        .input-row .input-row-clear {
            margin-left: 8px;
            padding: 4px 10px;
            font-size: 12px;
            flex-shrink: 0;
        }

        /* Saga 33 step 043: tab-completion popup chips. */
        .completion-popup {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 20px 8px;
            font-family: var(--mono);
        }
        .completion-chip {
            background: var(--surface1, #313244);
            color: var(--text);
            border: 1px solid var(--surface2, #45475a);
            border-radius: 4px;
            padding: 2px 8px;
            font-family: var(--mono);
            font-size: 13px;
            cursor: pointer;
        }
        .completion-chip:hover,
        .completion-chip.selected {
            background: var(--surface2, #45475a);
            border-color: var(--peach);
        }

            position: fixed;
            inset: 0;
            z-index: 250;
            background: rgba(17, 17, 27, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .splash-panel {
            position: relative;
            z-index: 1;
            max-width: 720px;
            width: 90vw;
            padding: 40px 48px;
            text-align: center;
            color: var(--text);
            background: url('splash-bg.png?ts=1779748856802') center/cover no-repeat;
            border-radius: 12px;
            border: 1px solid rgba(69, 71, 90, 0.5);
            overflow: hidden;
        }
        .splash-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(20, 24, 48, 0.45);
            border-radius: 12px;
        }
        .splash-panel > * { position: relative; z-index: 1; }
        .splash-header-shim {
            background: rgba(20, 28, 58, 0.7);
            border-radius: 8px;
            padding: 20px 24px 16px;
            margin-bottom: 20px;
        }
        .splash-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: #cdd6f4;
            font-size: 24px;
            cursor: pointer;
        }
        .splash-close:hover { color: #fff; }
        .splash-panel h2 {
            font-size: 38px;
            margin: 0 0 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: #fff;
        }

            var h = Math.max(40, Math.min(window.innerHeight * 0.7, startH + (e.clientY - startY)));
            outputEl.style.setProperty('height', h + 'px', 'important');
            outputEl.style.setProperty('flex-basis', h + 'px', 'important');
            e.preventDefault();
        });
        document.addEventListener('mouseup', function() {
            if (dragging) { document.body.style.cursor = ''; document.body.style.userSelect = ''; }
            dragging = false; outputEl = null;
        });
    };
    </script>
</body>
</html>
