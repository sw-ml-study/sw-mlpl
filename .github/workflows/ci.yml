name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci
  cancel-in-progress: true

jobs:
  fast-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            components/array
            components/syntax-parser
            components/eval
      - name: Format check (representative workspaces)
        run: |
          for w in array syntax-parser eval; do
            cargo fmt --all --check --manifest-path components/$w/Cargo.toml
          done
      - name: Fast unit suites
        run: |
          cargo test -p mlpl-array --manifest-path components/array/Cargo.toml
          cargo test -p mlpl-parser --manifest-path components/syntax-parser/Cargo.toml
      - name: Targeted eval suites
        run: |
          cargo test -p mlpl-eval --manifest-path components/eval/Cargo.toml \
            --test metadata_registry_tests --test metadata_reflect_tests \
            --test bracket_core_tests --test bracket_error_tests \
            --test events_core_tests --test events_transport_tests \
            --test expunge_tests --test transpose_axes_tests \
            --test apl2_idioms_doc_tests --test gen_state_core_tests
