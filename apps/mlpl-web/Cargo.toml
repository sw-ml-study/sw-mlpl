[package]
name = "mlpl-web"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
mlpl-wasm = { path = "../../crates/mlpl-wasm" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Blob",
    "CanvasRenderingContext2d",
    "Document",
    "Element",
    "Event",
    "File",
    "FileList",
    "FileReader",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "ImageData",
    "KeyboardEvent",
    "Window",
    "console",
] }
gloo = { version = "0.11", features = ["net"] }
# Saga 21.5 step 006: connect-mode evaluator JSON wire format.
serde_json = "1"

# Native build (test target only): the RemoteEvaluator uses
# `reqwest::blocking` against an in-process `mlpl-serve`. The
# WASM build pulls fetch via `gloo::net` instead, so this
# dependency is gated.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
# WASM build: futures runtime for fetch async dispatch.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
mlpl-eval = { path = "../../crates/mlpl-eval" }
mlpl-parser = { path = "../../crates/mlpl-parser" }
mlpl-serve = { path = "../../crates/mlpl-serve" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.7"
