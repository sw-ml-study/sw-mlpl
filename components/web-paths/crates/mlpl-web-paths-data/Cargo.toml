[package]
name = "mlpl-web-paths-data"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[lib]
name = "mlpl_web_paths_data"
path = "src/lib.rs"

[dependencies]

# build.rs reads paths.toml and generates the PATHS const into OUT_DIR, so the
# learning-path PROSE lives in data, not Rust source, and is not counted
# against the file/module budgets. Build-only -- not in the wasm bundle.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
