# Saga 56: components/autograd/ nested workspace.
#
# Houses automatic differentiation (mlpl-autograd) and execution
# trace export (mlpl-trace). Both observe runtime execution.

[workspace]
members = [
    "crates/mlpl-autograd",
    "crates/mlpl-trace",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.20.0"

[workspace.lints.clippy]
pedantic = "warn"
