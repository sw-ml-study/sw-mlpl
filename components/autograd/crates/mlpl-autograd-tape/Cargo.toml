[package]
name = "mlpl-autograd-tape"
edition.workspace = true
license.workspace = true
version.workspace = true

# The autograd substrate: the Tape and its node types, the elementwise
# op kernels (UnaryOp/BinaryOp/softmax/accumulate), and the pure
# gradient kernels for shape ops. Split from mlpl-autograd (tech-debt
# spike step 002) so the Tensor-facing crate stays inside the module
# budget while the substrate stays dependency-light.
[dependencies]
mlpl-core = { path = "../../../types/crates/mlpl-core" }
mlpl-array = { path = "../../../array/crates/mlpl-array" }
mlpl-array-ops-element = { path = "../../../array-element/crates/mlpl-array-ops-element" }
mlpl-array-ops-shape = { path = "../../../array-element/crates/mlpl-array-ops-shape" }
mlpl-array-ops-compose = { path = "../../../array-compose/crates/mlpl-array-ops-compose" }
mlpl-array-ops-matmul = { path = "../../../array-compose/crates/mlpl-array-ops-matmul" }
