[package]
name = "mlpl-web-viz3d"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "mlpl_web_viz3d"
path = "src/lib.rs"

[dependencies]
js-sys = "0.3"
mlpl-web-viz-ir = { path = "../../../web-viz-ir/crates/mlpl-web-viz-ir" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Window",
] }
yew = { version = "0.21", features = ["csr"] }

[dev-dependencies]
serde_json = "1"
