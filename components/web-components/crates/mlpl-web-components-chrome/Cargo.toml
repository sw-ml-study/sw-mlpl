[package]
name = "mlpl-web-components-chrome"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "mlpl_web_components_chrome"
path = "src/lib.rs"

[dependencies]
yew = { version = "0.21", features = ["csr"] }
# Connect button: discover backends from a serving proxy (GET
# /v1/backends) and navigate to ?connect=<url>; warn when no proxy
# (the static GitHub Pages demo). Needs fetch + window.location.
gloo = { version = "0.11", features = ["net"] }
wasm-bindgen-futures = "0.4"
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Location", "Document", "Element", "NodeList", "Node"] }
# Single source of truth for "is connect mode actually reachable from this
# page" (mixed-content / CORS guard), shared with the demo gating + :ask path.
mlpl-web-eval = { path = "../../../wasm/crates/mlpl-web-eval" }
