[package]
name = "mlpl-eval"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
# Saga 14 step 004: dispatch ops inside `device("mlx") { }` blocks
# through the `mlpl-mlx-rt` runtime. Off by default; the `mlpl-mlx-rt`
# crate itself triple-gates on macOS + aarch64, so building with
# this feature on a non-Apple host still compiles and falls back
# to CPU at runtime with a one-time warning.
# The `mlx` feature pulls only the `mlpl-mlx-rt` runtime, for `device("mlx")`
# op dispatch (device_dispatch.rs). The on-device LoRA/MLP training compute
# moved to the sibling `mlpl-mlx-eval` crate in S4 (the analog of the CUDA
# split in S3), so its stack (autodiff kernel + forward primitives + demo
# model) is no longer pulled here; a build that wants the GPU fast path
# registers `mlpl_mlx_eval::gpu_step()`. Triple-gates internally, so a
# non-Apple build with this feature still compiles (CPU tape path).
mlx = [
    "dep:mlpl-mlx-rt",
    "mlpl-mlx-rt/mlx",
    "mlpl-eval-env/mlx",
]
# Saga cuda-foundation step 004 + GPU workspace split S3: dispatch ops
# inside `device("cuda") { }` blocks through the CUDA (candle) runtime
# crates (per-op: matmul / cross_entropy / ... in device_dispatch), and
# enable the device-agnostic GPU optimizer seam (gpu_step / gpu_env /
# gpu_registry + the DemoLayout/LoraNames recognizers). The OPTIMIZER
# compute (forward/model/train/candle) moved to the sibling
# mlpl-cuda-eval crate in S3, so it is no longer pulled here; a build that
# wants the LoRA/MLP GPU fast path registers `mlpl_cuda_eval::gpu_step()`
# (the binaries do this at startup). The crates triple-gate internally, so
# enabling this on a non-Linux/non-GPU host still compiles + falls back to
# the CPU path.
cuda = [
    "mlpl-eval-env/cuda",
    "dep:mlpl-cuda-rt",
    "mlpl-cuda-rt/cuda",
    "dep:mlpl-cuda-elementwise",
    "mlpl-cuda-elementwise/cuda",
    "dep:mlpl-cuda-nn",
    "mlpl-cuda-nn/cuda",
]
# Saga 29 step 003: PNG / JPEG decode for the `load_images(dir,
# [H, W])` builtin. Off by default so the WASM target stays
# clean -- the browser REPL can still call
# `load_preloaded("pets_tiny")` because that fixture is
# pre-decoded bytes in the binary. Native binaries
# (`mlpl-cli`, `mlpl-repl`, `mlpl-serve`) enable this feature
# at build time. The decoder dispatch reads the file's magic
# bytes and routes to `png` or `jpeg-decoder` separately
# (smaller dep footprint than `image-rs`).
#
# Step 004 extends the feature to cover the `fetch_dataset`
# tarball-download path: `tar` + `flate2` for tarball extract,
# `sha2` for fixture verification, `ureq` for the HTTP GET
# itself (same pinned version + minimal-features as
# `mlpl-runtime`'s `llm_call` shim).
image-io = [
    "mlpl-eval-types/image-io",
    "dep:mlpl-eval-image",
    "mlpl-eval-image/image-io",
    "dep:png",
    "dep:jpeg-decoder",
    "dep:tar",
    "dep:flate2",
    "dep:sha2",
    "dep:ureq",
]

[dependencies]
mlpl-bpe-core = { path = "../../../session-infra/crates/mlpl-bpe-core" }
mlpl-core = { path = "../../../types/crates/mlpl-core" }
mlpl-eval-core = { path = "../../../types/crates/mlpl-eval-core" }
mlpl-eval-env = { path = "../mlpl-eval-env" }
mlpl-eval-state = { path = "../../../types/crates/mlpl-eval-state" }
mlpl-eval-pets-tiny = { path = "../../../eval-pets-tiny/crates/mlpl-eval-pets-tiny" }
mlpl-eval-types = { path = "../../../eval-types/crates/mlpl-eval-types" }
mlpl-env-traits = { path = "../../../session-infra/crates/mlpl-env-traits" }
mlpl-loader-helpers = { path = "../../../session-infra/crates/mlpl-loader-helpers" }
mlpl-models-feasibility = { path = "../../../models-read/crates/mlpl-models-feasibility" }
mlpl-models-freeze = { path = "../../../models-read/crates/mlpl-models-freeze" }
mlpl-models-inspect = { path = "../../../models-read/crates/mlpl-models-inspect" }
mlpl-models-llm = { path = "../../../models-llm/crates/mlpl-models-llm" }
mlpl-models-mutate = { path = "../../../models-write/crates/mlpl-models-mutate" }
mlpl-models-tape = { path = "../../../models-write/crates/mlpl-models-tape" }
mlpl-models-tune = { path = "../../../models-write/crates/mlpl-models-tune" }
mlpl-parser = { path = "../../../syntax-parser/crates/mlpl-parser" }
mlpl-array = { path = "../../../array/crates/mlpl-array" }
mlpl-array-ops-element = { path = "../../../array-element/crates/mlpl-array-ops-element" }
mlpl-array-ops-shape = { path = "../../../array-element/crates/mlpl-array-ops-shape" }
mlpl-array-ops-compose = { path = "../../../array-compose/crates/mlpl-array-ops-compose" }
mlpl-array-ops-reduce = { path = "../../../array-compose/crates/mlpl-array-ops-reduce" }
mlpl-array-ops-matmul = { path = "../../../array-compose/crates/mlpl-array-ops-matmul" }
mlpl-autograd = { path = "../../../autograd/crates/mlpl-autograd" }
mlpl-runtime = { path = "../../../runtime-core/crates/mlpl-runtime" }
mlpl-trace = { path = "../../../autograd/crates/mlpl-trace" }
mlpl-viz = { path = "../../../viz/crates/mlpl-viz" }
mlpl-mlx-rt = { path = "../../../native-rt/crates/mlpl-mlx-rt", optional = true }
mlpl-cuda-rt = { path = "../../../cuda-rt/crates/mlpl-cuda-rt", optional = true }
mlpl-cuda-elementwise = { path = "../../../cuda-rt/crates/mlpl-cuda-elementwise", optional = true }
mlpl-cuda-nn = { path = "../../../cuda-rt/crates/mlpl-cuda-nn", optional = true }
mlpl-eval-image = { path = "../../../eval-image/crates/mlpl-eval-image", optional = true }
png = { version = "0.17", optional = true }
jpeg-decoder = { version = "0.3", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mlpl-lower-rs = { path = "../../../syntax-codegen/crates/mlpl-lower-rs" }
# Tic-tac-toe engine: used only by the win-rate tests
# (classifier_winrate, tictactoe_winrate). No longer a runtime dep --
# the demo's game logic is now MLPL (examples/tictactoe-demo.mlpl).
mlpl-tictactoe = { path = "../../../games/crates/mlpl-tictactoe" }
# Saga 19 step 001: stub Ollama HTTP responses for
# `llm_call` tests without requiring a live server.
mockito = "1"
