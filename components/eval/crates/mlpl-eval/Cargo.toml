[package]
name = "mlpl-eval"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
# Saga 14 step 004: dispatch ops inside `device("mlx") { }` blocks
# through the `mlpl-mlx-rt` runtime. Off by default; the `mlpl-mlx-rt`
# crate itself triple-gates on macOS + aarch64, so building with
# this feature on a non-Apple host still compiles and falls back
# to CPU at runtime with a one-time warning.
mlx = ["dep:mlpl-mlx-rt", "mlpl-mlx-rt/mlx"]
# Saga 29 step 003: PNG / JPEG decode for the `load_images(dir,
# [H, W])` builtin. Off by default so the WASM target stays
# clean -- the browser REPL can still call
# `load_preloaded("pets_tiny")` because that fixture is
# pre-decoded bytes in the binary. Native binaries
# (`mlpl-cli`, `mlpl-repl`, `mlpl-serve`) enable this feature
# at build time. The decoder dispatch reads the file's magic
# bytes and routes to `png` or `jpeg-decoder` separately
# (smaller dep footprint than `image-rs`).
#
# Step 004 extends the feature to cover the `fetch_dataset`
# tarball-download path: `tar` + `flate2` for tarball extract,
# `sha2` for fixture verification, `ureq` for the HTTP GET
# itself (same pinned version + minimal-features as
# `mlpl-runtime`'s `llm_call` shim).
image-io = [
    "dep:png",
    "dep:jpeg-decoder",
    "dep:tar",
    "dep:flate2",
    "dep:sha2",
    "dep:ureq",
]

[dependencies]
mlpl-bpe-core = { path = "../../../mlpl-session/crates/mlpl-bpe-core" }
mlpl-core = { path = "../../../lang-core/crates/mlpl-core" }
mlpl-eval-core = { path = "../../../lang-core/crates/mlpl-eval-core" }
mlpl-env-traits = { path = "../../../mlpl-session/crates/mlpl-env-traits" }
mlpl-loader-helpers = { path = "../../../mlpl-session/crates/mlpl-loader-helpers" }
mlpl-models-feasibility = { path = "../../../mlpl-session/crates/mlpl-models-feasibility" }
mlpl-models-freeze = { path = "../../../mlpl-session/crates/mlpl-models-freeze" }
mlpl-models-inspect = { path = "../../../mlpl-session/crates/mlpl-models-inspect" }
mlpl-models-llm = { path = "../../../mlpl-session/crates/mlpl-models-llm" }
mlpl-models-mutate = { path = "../../../mlpl-session/crates/mlpl-models-mutate" }
mlpl-models-tape = { path = "../../../mlpl-session/crates/mlpl-models-tape" }
mlpl-models-tune = { path = "../../../mlpl-session/crates/mlpl-models-tune" }
mlpl-parser = { path = "../../../lang-syntax/crates/mlpl-parser" }
mlpl-array = { path = "../../../lang-core/crates/mlpl-array" }
mlpl-array-ops-element = { path = "../../../lang-core/crates/mlpl-array-ops-element" }
mlpl-array-ops-shape = { path = "../../../lang-core/crates/mlpl-array-ops-shape" }
mlpl-array-ops-compose = { path = "../../../lang-core/crates/mlpl-array-ops-compose" }
mlpl-array-ops-reduce = { path = "../../../lang-core/crates/mlpl-array-ops-reduce" }
mlpl-array-ops-matmul = { path = "../../../lang-core/crates/mlpl-array-ops-matmul" }
mlpl-autograd = { path = "../../../autograd/crates/mlpl-autograd" }
mlpl-runtime = { path = "../../../runtime-core/crates/mlpl-runtime" }
mlpl-trace = { path = "../../../autograd/crates/mlpl-trace" }
mlpl-viz = { path = "../../../viz/crates/mlpl-viz" }
mlpl-mlx-rt = { path = "../../../native-rt/crates/mlpl-mlx-rt", optional = true }
png = { version = "0.17", optional = true }
jpeg-decoder = { version = "0.3", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
mlpl-lower-rs = { path = "../../../lang-syntax/crates/mlpl-lower-rs" }
# Saga 19 step 001: stub Ollama HTTP responses for
# `llm_call` tests without requiring a live server.
mockito = "1"
