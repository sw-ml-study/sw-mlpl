# Saga 59: components/eval/ nested workspace.
# Tree-walking interpreter (mlpl-eval). 96 modules currently FAIL;
# decomposition deferred to a future eval-decompose saga.

[workspace]
members = ["crates/mlpl-eval", "crates/mlpl-eval-env", "crates/mlpl-eval-envc-bindings"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.20.0"

[workspace.lints.clippy]
pedantic = "warn"

# Saga 64: each top-level workspace that transitively uses mlx-rs
# carries its own patch since Cargo evaluates patches per-workspace.
[patch.crates-io]
mlx-rs = { path = "../../vendor/mlx-rs" }
