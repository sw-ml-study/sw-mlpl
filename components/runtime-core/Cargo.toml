# Saga 67: split out from components/runtime/ for sparse component layout.

[workspace]
members = [
    "crates/mlpl-runtime",
    "crates/mlpl-runtime-core",
    "crates/mlpl-extension-abi",
    "crates/mlpl-extension-registry",
    "crates/mlpl-extension-cabi",
    "crates/mlpl-ext-hello-static",
    "crates/mlpl-ext-testdylib",
    "crates/mlpl-extension-loader",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.20.0"

[workspace.lints.clippy]
pedantic = "warn"
