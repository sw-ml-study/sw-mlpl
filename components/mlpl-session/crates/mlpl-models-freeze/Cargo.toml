# model_freeze.rs. The forward pass is generic over the
# capability traits (HasModels + HasFrozen) from
# mlpl-env-traits + a caller-supplied resolver closure, so this
# crate never imports mlpl-eval -- proving the C+D loose-
# coupling boundary works end-to-end.

