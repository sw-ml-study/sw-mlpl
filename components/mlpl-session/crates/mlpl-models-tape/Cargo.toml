# Saga 33 step 008: autograd tape lowering of the model DSL,
# extracted from `crates/mlpl-eval/src/model_tape*.rs`. Pure
# computational kernel -- takes `&HashMap<String, Tensor>` for
# params and a `&ModelSpec`, returns a `Tensor` graph. No
# Environment dependency, so this crate doesn't need the env
# capability traits.

[package]
name = "mlpl-models-tape"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
mlpl-array = { path = "../../../array/crates/mlpl-array" }
mlpl-array-ops-matmul = { path = "../../../array-compose/crates/mlpl-array-ops-matmul" }
mlpl-autograd = { path = "../../../autograd/crates/mlpl-autograd" }
mlpl-core = { path = "../../../types/crates/mlpl-core" }
mlpl-eval-core = { path = "../../../types/crates/mlpl-eval-core" }
