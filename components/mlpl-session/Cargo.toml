# Saga 33 step 008: nested workspace housing the mlpl-eval session
# component. Splits Environment + model DSL into loosely-coupled
# sub-crates (each <= 7 modules) using the C+D pattern:
# (state struct, inherent methods, capability trait).
#
# Path deps reach back into the main workspace via `../../crates/...`;
# cross-workspace path deps work and build into the consumer's
# target. Pattern follows services/mlpl-mlx-serve/.

[workspace]
members = [
    "crates/mlpl-env-traits",
    "crates/mlpl-models-feasibility",
    "crates/mlpl-models-freeze",
    "crates/mlpl-models-inspect",
    "crates/mlpl-models-mutate",
    "crates/mlpl-models-tape",
    "crates/mlpl-models-tune",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.20.0"
