[package]
name = "mlpl-web-path-body"
edition.workspace = true
license.workspace = true
version.workspace = true

# Saga 32 step 003: path-body markdown-ish renderer extracted
# from apps/mlpl-web. Self-contained subtree (blocks, inline,
# block_acc, inline_render + the mod facade). Used by
# entry_render, glossary_*, paths_view in mlpl-web. Depends
# only on yew + wasm-bindgen; no back-imports into mlpl-web.

[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "console",
    "CustomEvent",
    "CustomEventInit",
    "EventTarget",
    "Window",
] }
