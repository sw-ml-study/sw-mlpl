[package]
name = "mlpl-web"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[lib]
name = "mlpl_web"
path = "src/lib.rs"

[[bin]]
name = "mlpl-web"
path = "src/main.rs"

[dependencies]
mlpl-wasm = { path = "../../../wasm/crates/mlpl-wasm" }
mlpl-web-completion = { path = "../../../web-completion/crates/mlpl-web-completion" }
mlpl-web-components-chrome = { path = "../../../web-components/crates/mlpl-web-components-chrome" }
mlpl-web-components-content = { path = "../../../web-components/crates/mlpl-web-components-content" }
mlpl-web-demos = { path = "../../../web-demos/crates/mlpl-web-demos" }
mlpl-web-eval = { path = "../../../wasm/crates/mlpl-web-eval" }
mlpl-web-glossary = { path = "../../../web-glossary/crates/mlpl-web-glossary" }
mlpl-web-handlers-eval = { path = "../../../web-handlers/crates/mlpl-web-handlers-eval" }
mlpl-web-handlers-input = { path = "../../../web-handlers/crates/mlpl-web-handlers-input" }
mlpl-web-handlers-upload = { path = "../../../web-handlers/crates/mlpl-web-handlers-upload" }
mlpl-web-mode = { path = "../../../web-mode/crates/mlpl-web-mode" }
mlpl-web-onboarding = { path = "../../../web-onboarding/crates/mlpl-web-onboarding" }
mlpl-web-tutorial = { path = "../../../web-tutorial/crates/mlpl-web-tutorial" }
mlpl-web-paths = { path = "../../../web-paths/crates/mlpl-web-paths" }
mlpl-web-paths-data = { path = "../../../web-paths/crates/mlpl-web-paths-data" }
mlpl-web-render-aux = { path = "../../../web-render/crates/mlpl-web-render-aux" }
mlpl-web-render-core = { path = "../../../web-render/crates/mlpl-web-render-core" }
mlpl-web-render-shell = { path = "../../../web-render/crates/mlpl-web-render-shell" }
mlpl-web-render-types = { path = "../../../web-render/crates/mlpl-web-render-types" }
mlpl-web-viz3d = { path = "../../../web-viz3d/crates/mlpl-web-viz3d" }
mlpl-web-lessons = { path = "../../crates/mlpl-web-lessons" }
mlpl-web-path-body = { path = "../../crates/mlpl-web-path-body" }
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Blob",
    "CanvasRenderingContext2d",
    "CustomEvent",
    "CustomEventInit",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlCanvasElement",
    "HtmlCollection",
    "HtmlDivElement",
    "HtmlElement",
    "HtmlImageElement",
    "Node",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "ImageData",
    "DomRect",
    "KeyboardEvent",
    "History",
    "Location",
    "Storage",
    "Window",
    "console",
] }
gloo = { version = "0.11", features = ["net"] }
# Saga 21.5 step 006: connect-mode evaluator JSON wire format.
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

# Native build (test target only): the RemoteEvaluator uses
# `reqwest::blocking` against an in-process `mlpl-serve`. The
# WASM build pulls fetch via `gloo::net` instead, so this
# dependency is gated.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
# WASM build: futures runtime for fetch async dispatch.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
# Saga 33 step 043: tab-completion sources its candidate
# builtin names from `mlpl_eval::runtime_builtin_names`.
# Native builds don't need this dep -- the keydown handler
# cfg-gates the lookup to an empty Vec, and the pure helpers
# in `completion.rs` are exercised separately.
mlpl-eval = { path = "../../../eval/crates/mlpl-eval" }

[dev-dependencies]
# The #[path] connect-test harnesses include mlpl-web-eval source
# files whose imports now reach the split-out core crate directly.
mlpl-web-eval-core = { path = "../../../wasm/crates/mlpl-web-eval-core" }
mlpl-eval = { path = "../../../eval/crates/mlpl-eval" }
mlpl-parser = { path = "../../../syntax-parser/crates/mlpl-parser" }
mlpl-serve = { path = "../../../serve/crates/mlpl-serve" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = "0.7"
