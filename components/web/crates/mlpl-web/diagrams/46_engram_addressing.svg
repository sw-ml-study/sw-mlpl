<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" width="600" height="430" style="background-color:white;font-family:'trebuchet ms',verdana,arial,sans-serif;font-size:12px">
  <text x="300" y="22" text-anchor="middle" font-size="16" font-weight="bold">Engram: deterministic memory addressing</text>

  <!-- ids -->
  <rect x="20" y="44" width="130" height="40" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="85" y="61" text-anchor="middle" font-weight="bold">token ids [T]</text>
  <text x="85" y="76" text-anchor="middle" font-size="10">the chain threads its own input</text>

  <!-- hash -->
  <rect x="190" y="44" width="180" height="40" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
  <text x="280" y="61" text-anchor="middle" font-family="monospace" font-size="11">ngram_hash(ids, ...)</text>
  <text x="280" y="76" text-anchor="middle" font-size="10">frozen contract: same bits on CPU + GPU</text>
  <line x1="150" y1="64" x2="190" y2="64" stroke="#1f2937" stroke-width="1.5"/>

  <!-- slots -->
  <rect x="410" y="44" width="170" height="40" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="495" y="61" text-anchor="middle" font-weight="bold">slot indices</text>
  <text x="495" y="76" text-anchor="middle" font-size="10">[T, orders, heads]</text>
  <line x1="370" y1="64" x2="410" y2="64" stroke="#1f2937" stroke-width="1.5"/>

  <!-- selection + memory -->
  <rect x="60" y="120" width="210" height="52" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="165" y="140" text-anchor="middle" font-weight="bold">one-hot selection [n, rows]</text>
  <text x="165" y="156" text-anchor="middle" font-size="10">row r picks the addressed memory row</text>
  <line x1="495" y1="84" x2="200" y2="120" stroke="#1f2937" stroke-width="1.5"/>

  <rect x="330" y="120" width="210" height="52" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="435" y="140" text-anchor="middle" font-weight="bold">memory table [rows, head_dim]</text>
  <text x="435" y="156" text-anchor="middle" font-size="10">the trainable parameter</text>

  <!-- gather matmul -->
  <rect x="180" y="200" width="240" height="44" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
  <text x="300" y="218" text-anchor="middle" font-family="monospace" font-size="11">sel @ memory  =  gather</text>
  <text x="300" y="234" text-anchor="middle" font-size="10">retrieved [T, width], lazy on the device</text>
  <line x1="165" y1="172" x2="240" y2="200" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="435" y1="172" x2="360" y2="200" stroke="#1f2937" stroke-width="1.5"/>

  <!-- value / gate -->
  <rect x="40" y="276" width="230" height="44" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="155" y="294" text-anchor="middle" font-family="monospace" font-size="11">v = value_linear(retrieved)</text>
  <text x="155" y="310" text-anchor="middle" font-size="10">what the memory says</text>
  <rect x="330" y="276" width="240" height="44" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="450" y="294" text-anchor="middle" font-family="monospace" font-size="11">g = sigmoid(gate([h | v]))</text>
  <text x="450" y="310" text-anchor="middle" font-size="10">how much to trust it (starts ~0.12)</text>
  <line x1="260" y1="244" x2="180" y2="276" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="340" y1="244" x2="420" y2="276" stroke="#1f2937" stroke-width="1.5"/>

  <!-- output -->
  <rect x="180" y="352" width="240" height="36" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="300" y="375" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold">out = h + g * v</text>
  <line x1="155" y1="320" x2="250" y2="352" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="450" y1="320" x2="350" y2="352" stroke="#1f2937" stroke-width="1.5"/>

  <!-- backward note -->
  <text x="300" y="412" text-anchor="middle" font-size="11" fill="#b91c1c">backward: sel^T @ upstream = exact scatter-ADD into only the addressed rows (duplicate addresses accumulate)</text>
</svg>
