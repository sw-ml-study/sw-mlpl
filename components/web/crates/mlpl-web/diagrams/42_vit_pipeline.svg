<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320" style="background-color:white;font-family:'trebuchet ms',verdana,arial,sans-serif;font-size:13px;fill:#333">
  <text x="350" y="22" text-anchor="middle" font-size="16" font-weight="bold">ViT forward pipeline (cat vs dog)</text>

  <!-- step boxes -->
  <g transform="translate(20,60)">
    <rect x="0" y="0" width="100" height="50" fill="#fef3c7" stroke="#a16207"/>
    <text x="50" y="20" text-anchor="middle" font-weight="bold">image</text>
    <text x="50" y="38" text-anchor="middle" font-size="11">[1, 3, 64, 64]</text>

    <rect x="130" y="0" width="100" height="50" fill="#ddd6fe" stroke="#5b21b6"/>
    <text x="180" y="18" text-anchor="middle" font-weight="bold">patchify(_, 16)</text>
    <text x="180" y="34" text-anchor="middle" font-size="11">[1, 16, 768]</text>
    <text x="180" y="48" text-anchor="middle" font-size="10" fill="#666">16 patches</text>

    <rect x="260" y="0" width="100" height="50" fill="#ddd6fe" stroke="#5b21b6"/>
    <text x="310" y="18" text-anchor="middle" font-weight="bold">linear 768-&gt;128</text>
    <text x="310" y="34" text-anchor="middle" font-size="11">[16, 128]</text>
    <text x="310" y="48" text-anchor="middle" font-size="10" fill="#666">patch embed</text>

    <rect x="390" y="0" width="100" height="50" fill="#ddd6fe" stroke="#5b21b6"/>
    <text x="440" y="18" text-anchor="middle" font-weight="bold">+ CLS + pos</text>
    <text x="440" y="34" text-anchor="middle" font-size="11">[17, 128]</text>
    <text x="440" y="48" text-anchor="middle" font-size="10" fill="#666">concat + add</text>

    <rect x="520" y="0" width="160" height="50" fill="#dbeafe" stroke="#1d4ed8"/>
    <text x="600" y="18" text-anchor="middle" font-weight="bold">attention(128, h)</text>
    <text x="600" y="34" text-anchor="middle" font-size="11">[17, 128]</text>
    <text x="600" y="48" text-anchor="middle" font-size="10" fill="#666">softmax(QK^T/sqrt(d))V</text>
  </g>

  <line x1="120" y1="85" x2="148" y2="85" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="250" y1="85" x2="278" y2="85" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="85" x2="408" y2="85" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="510" y1="85" x2="538" y2="85" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- second row -->
  <g transform="translate(20,170)">
    <rect x="0" y="0" width="120" height="50" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="60" y="18" text-anchor="middle" font-weight="bold">take(_, 1, 0)</text>
    <text x="60" y="34" text-anchor="middle" font-size="11">[128]</text>
    <text x="60" y="48" text-anchor="middle" font-size="10" fill="#666">CLS-token pool</text>

    <rect x="160" y="0" width="120" height="50" fill="#ddd6fe" stroke="#5b21b6"/>
    <text x="220" y="18" text-anchor="middle" font-weight="bold">MLP head</text>
    <text x="220" y="32" text-anchor="middle" font-size="11">linear 128-&gt;64</text>
    <text x="220" y="46" text-anchor="middle" font-size="11">relu -&gt; linear 64-&gt;2</text>

    <rect x="300" y="0" width="120" height="50" fill="#dcfce7" stroke="#15803d"/>
    <text x="360" y="18" text-anchor="middle" font-weight="bold">argmax</text>
    <text x="360" y="34" text-anchor="middle" font-size="11">[1]</text>
    <text x="360" y="48" text-anchor="middle" font-size="10" fill="#666">0 = cat, 1 = dog</text>

    <rect x="440" y="0" width="160" height="50" fill="#fde68a" stroke="#a16207"/>
    <text x="520" y="18" text-anchor="middle" font-weight="bold">cross_entropy</text>
    <text x="520" y="34" text-anchor="middle" font-size="11">[]</text>
    <text x="520" y="48" text-anchor="middle" font-size="10" fill="#666">vs label; back through tape</text>
  </g>
  <line x1="140" y1="195" x2="168" y2="195" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="195" x2="308" y2="195" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="195" x2="448" y2="195" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- between rows -->
  <path d="M 620,110 Q 620,140 50,140 Q 50,170 80,170" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="350" y="135" text-anchor="middle" font-size="11" font-style="italic" fill="#666">attention output [17, 128]</text>

  <text x="350" y="285" text-anchor="middle" font-size="11" fill="#666">Web demos: "Pets: cat vs dog (quick)", "Pets: multi-head ViT (quick + viz)"</text>
  <text x="350" y="305" text-anchor="middle" font-size="11" fill="#666">CLI version (deeper training): demos/vit_single_head_quick.mlpl / vit_multihead_thorough.mlpl</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
  </defs>
</svg>
