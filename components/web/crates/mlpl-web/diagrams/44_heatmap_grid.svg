<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" style="background-color:white;font-family:'trebuchet ms',verdana,arial,sans-serif;font-size:13px;fill:#333">
  <text x="320" y="22" text-anchor="middle" font-size="16" font-weight="bold">svg(weights, "heatmap_grid") on [N, R, C]</text>

  <!-- left: source tensor -->
  <g transform="translate(40,60)">
    <text x="100" y="0" text-anchor="middle" font-weight="bold">input tensor</text>
    <text x="100" y="18" text-anchor="middle" font-size="11">attention_weights output</text>
    <text x="100" y="34" text-anchor="middle" font-family="monospace" font-size="11">[4, 17, 17]</text>
    <!-- depict 4 stacked planes -->
    <g>
      <rect x="40"  y="50" width="120" height="80" fill="#dbeafe" stroke="#1d4ed8"/>
      <rect x="30"  y="60" width="120" height="80" fill="#dcfce7" stroke="#15803d"/>
      <rect x="20"  y="70" width="120" height="80" fill="#fef3c7" stroke="#a16207"/>
      <rect x="10"  y="80" width="120" height="80" fill="#fee2e2" stroke="#b91c1c"/>
      <text x="70" y="125" text-anchor="middle" font-size="11">[17, 17] x 4 heads</text>
    </g>
  </g>

  <!-- arrow -->
  <g transform="translate(240,140)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#1f2937" stroke-width="2" marker-end="url(#arr)"/>
    <text x="40" y="-8" text-anchor="middle" font-style="italic">heatmap_grid</text>
    <text x="40" y="20" text-anchor="middle" font-size="11" fill="#666">unfold N slabs</text>
  </g>

  <!-- right: 2x2 grid output -->
  <g transform="translate(360,50)">
    <text x="120" y="-2" text-anchor="middle" font-weight="bold">rendered grid</text>
    <text x="120" y="14" text-anchor="middle" font-size="11">cols = ceil(sqrt(N))</text>

    <!-- 4 cells with head labels and color strips -->
    <g transform="translate(0,30)">
      <text x="60" y="10" text-anchor="middle" font-size="11">head 0</text>
      <rect x="10"  y="15" width="100" height="80" fill="#dbeafe" stroke="#1d4ed8"/>
      <rect x="10"  y="98" width="100" height="6" fill="url(#g0)"/>
      <text x="10"  y="118" font-size="10" fill="#444">0.04</text>
      <text x="110" y="118" font-size="10" fill="#444" text-anchor="end">0.31</text>

      <text x="180" y="10" text-anchor="middle" font-size="11">head 1</text>
      <rect x="130" y="15" width="100" height="80" fill="#dcfce7" stroke="#15803d"/>
      <rect x="130" y="98" width="100" height="6" fill="url(#g0)"/>
      <text x="130" y="118" font-size="10" fill="#444">0.02</text>
      <text x="230" y="118" font-size="10" fill="#444" text-anchor="end">0.55</text>
    </g>
    <g transform="translate(0,160)">
      <text x="60" y="10" text-anchor="middle" font-size="11">head 2</text>
      <rect x="10"  y="15" width="100" height="80" fill="#fef3c7" stroke="#a16207"/>
      <rect x="10"  y="98" width="100" height="6" fill="url(#g0)"/>
      <text x="10"  y="118" font-size="10" fill="#444">0.06</text>
      <text x="110" y="118" font-size="10" fill="#444" text-anchor="end">0.22</text>

      <text x="180" y="10" text-anchor="middle" font-size="11">head 3</text>
      <rect x="130" y="15" width="100" height="80" fill="#fee2e2" stroke="#b91c1c"/>
      <rect x="130" y="98" width="100" height="6" fill="url(#g0)"/>
      <text x="130" y="118" font-size="10" fill="#444">0.01</text>
      <text x="230" y="118" font-size="10" fill="#444" text-anchor="end">0.88</text>
    </g>
  </g>

  <text x="320" y="320" text-anchor="middle" font-size="11" fill="#666">Each cell carries its OWN min/max colormap -- per-head magnitudes differ.</text>
  <text x="320" y="338" text-anchor="middle" font-size="11" fill="#666">One sharp head and one diffuse head both render with visible structure.</text>

  <defs>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44025a"/>
      <stop offset="0.5" stop-color="#21918c"/>
      <stop offset="1" stop-color="#fde725"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
  </defs>
</svg>
