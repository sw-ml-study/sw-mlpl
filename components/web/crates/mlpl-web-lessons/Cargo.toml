[package]
name = "mlpl-web-lessons"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

# Tutorial-lesson content. The PROSE + example code live in lessons.toml;
# build.rs generates the LESSONS const from it. `lessons` holds the Lesson
# type + generated array, `intro_md` the tutorial-intro markdown renderer.

[dependencies]
yew = { version = "0.21", features = ["csr"] }

# build-only -- the toml parser is not in the wasm bundle.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
