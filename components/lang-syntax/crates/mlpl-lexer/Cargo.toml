[package]
name = "mlpl-lexer"
edition.workspace = true
license.workspace = true
version.workspace = true

# Top-level lexer orchestrator. Drives a Lexer state machine that
# delegates to per-concern sibling crates: mlpl-lex-string,
# mlpl-lex-number, mlpl-lex-punct, mlpl-lex-ident. Re-exports the
# public token / error API so downstream consumers keep their
# existing `mlpl_lexer::{Token, TokenKind, ParseError, ...}` imports.

[dependencies]
mlpl-core = { path = "../../../lang-core/crates/mlpl-core" }
mlpl-lex-ident = { path = "../mlpl-lex-ident" }
mlpl-lex-number = { path = "../mlpl-lex-number" }
mlpl-lex-punct = { path = "../mlpl-lex-punct" }
mlpl-lex-string = { path = "../mlpl-lex-string" }
mlpl-lexer-error = { path = "../mlpl-lexer-error" }
mlpl-lexer-token = { path = "../mlpl-lexer-token" }
