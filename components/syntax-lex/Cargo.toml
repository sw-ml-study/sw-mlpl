# Saga 68: split out from components/lang-syntax/.

[workspace]
members = [
    "crates/mlpl-lex-ident",
    "crates/mlpl-lex-number",
    "crates/mlpl-lex-punct",
    "crates/mlpl-lex-string",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.20.0"

[workspace.lints.clippy]
pedantic = "warn"
