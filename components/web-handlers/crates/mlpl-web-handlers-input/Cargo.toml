[package]
name = "mlpl-web-handlers-input"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "mlpl_web_handlers_input"
path = "src/lib.rs"

[dependencies]
mlpl-eval = { path = "../../../eval/crates/mlpl-eval" }
mlpl-web-completion = { path = "../../../web-completion/crates/mlpl-web-completion" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "HtmlInputElement",
    "KeyboardEvent",
    "MouseEvent",
] }
yew = { version = "0.21", features = ["csr"] }
