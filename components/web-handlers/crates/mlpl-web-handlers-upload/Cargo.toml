[package]
name = "mlpl-web-handlers-upload"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "mlpl_web_handlers_upload"
path = "src/lib.rs"

[dependencies]
mlpl-wasm = { path = "../../../wasm/crates/mlpl-wasm" }
mlpl-web-eval = { path = "../../../wasm/crates/mlpl-web-eval" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "CanvasRenderingContext2d",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileReader",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlInputElement",
    "ImageData",
    "Url",
    "Window",
] }
yew = { version = "0.21", features = ["csr"] }
js-sys = "0.3"
