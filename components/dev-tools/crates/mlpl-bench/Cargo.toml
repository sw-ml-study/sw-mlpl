[package]
name = "mlpl-bench"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Saga 14 step 008: enable the MLX-vs-CPU Criterion harness. Pulls
# in `mlpl-eval` with its `mlx` feature so `device("mlx") { }`
# blocks in the bench source actually route through `mlpl-mlx-rt`.
# Triple-gated at the call site on macOS + aarch64.
mlx = ["mlpl-eval/mlx"]

[dependencies]
mlpl-rt = { path = "../../../native-rt/crates/mlpl-rt" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
mlpl-array = { path = "../../../array/crates/mlpl-array" }
mlpl-array-ops-element = { path = "../../../array-element/crates/mlpl-array-ops-element" }
mlpl-array-ops-matmul = { path = "../../../array-compose/crates/mlpl-array-ops-matmul" }
mlpl-eval = { path = "../../../eval/crates/mlpl-eval" }
mlpl-tensor-handle = { path = "../../../array/crates/mlpl-tensor-handle" }
mlpl-parser = { path = "../../../syntax-parser/crates/mlpl-parser" }

[build-dependencies]
mlpl-lower-rs = { path = "../../../syntax-codegen/crates/mlpl-lower-rs" }
mlpl-array-ops-matmul = { path = "../../../array-compose/crates/mlpl-array-ops-matmul" }
mlpl-parser = { path = "../../../syntax-parser/crates/mlpl-parser" }

[[bench]]
name = "interp_vs_compiled"
harness = false

[[bench]]
name = "mlx_vs_cpu"
harness = false
required-features = ["mlx"]
