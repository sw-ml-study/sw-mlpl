# Saga 63: mlpl-mlx-serve moved into components/serve/ alongside
# mlpl-serve. Now a sibling member of the serve component workspace.

[package]
name = "mlpl-mlx-serve"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mlpl-mlx-serve"
path = "src/main.rs"

[dependencies]
mlpl-serve = { path = "../mlpl-serve" }
mlpl-eval = { path = "../../../eval/crates/mlpl-eval" }
mlpl-parser = { path = "../../../syntax-parser/crates/mlpl-parser" }
mlpl-mlx-rt = { path = "../../../native-rt/crates/mlpl-mlx-rt" }
mlpl-array = { path = "../../../array/crates/mlpl-array" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
bincode = "1"
base64 = "0.22"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
