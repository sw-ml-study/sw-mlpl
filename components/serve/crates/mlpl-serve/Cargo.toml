[package]
name = "mlpl-serve"
edition.workspace = true
license.workspace = true
version.workspace = true

# Saga 21 step 001: ship as both a binary (so users
# run `mlpl-serve --bind ... --auth ...`) and a
# library (so integration tests + future clients can
# spin up the server in-process via
# `mlpl_serve::server::build_app(...)` /
# `run(...)`).
[lib]
path = "src/lib.rs"

[[bin]]
name = "mlpl-serve"
path = "src/main.rs"

[features]
# Pass through mlpl-eval's MLX feature so a server built with
# `--features mlx` on Apple Silicon runs `device("mlx") { }` blocks
# (forwarded from the connect-mode web demos) on the GPU in-process.
# Off by default; non-Apple / CI builds stay CPU-only.
mlx = ["mlpl-eval/mlx"]
# Saga cuda-foundation step 007: pass through mlpl-eval's cuda feature
# so a server built with `--features cuda` on Linux + NVIDIA runs
# `device("cuda") { }` blocks (forwarded from connect-mode web demos)
# on the GPU in-process. Off by default; non-Linux / CI builds stay
# CPU-only. This is what makes this box a connect-mode CUDA peer.
cuda = ["mlpl-eval/cuda", "dep:mlpl-cuda-eval", "mlpl-cuda-eval/cuda"]

[dependencies]
mlpl-parser = { path = "../../../syntax-parser/crates/mlpl-parser" }
mlpl-eval = { path = "../../../eval/crates/mlpl-eval" }
mlpl-cuda-eval = { path = "../../../cuda-eval/crates/mlpl-cuda-eval", optional = true }
mlpl-array = { path = "../../../array/crates/mlpl-array" }
# Phase 1c part 2: build a model's Sankey VizNode server-side so a
# model evaluated in connect mode renders its decomposition.
mlpl-web-viz-ir = { path = "../../../web-viz-ir/crates/mlpl-web-viz-ir" }
mlpl-model-viz = { path = "../../../web-viz-ir/crates/mlpl-model-viz" }
# GET /v1/stats backend telemetry (CPU/RAM/GPU/VRAM) for the REPL's
# live "evaluating..." sparklines + the :status self-test. Platform
# sources live in the monitoring component; serve stays platform-agnostic.
mlpl-monitor = { path = "../../../monitoring/crates/mlpl-monitor" }
# Cap rayon's global pool at startup (cores - 2) so the parallel matmul
# leaves headroom for the async runtime to keep serving /v1/stats (the
# live telemetry panel) while a CPU-heavy eval runs. Same rayon the
# array crate's matmul uses, configured via its global pool.
rayon = "1"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
# Saga 21.5 step 001: ReceiverStream adapter so an axum SSE
# response can pull events from a tokio mpsc receiver.
tokio-stream = "0.1"
tower = "0.4"
# Saga 25 step A: serve the web UI's static `pages/`
# build alongside the /v1 API so the WASM client and
# the API live on one origin (no CORS plumbing).
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
# Saga 25 step B: HTTPS support so browsers with
# HTTPS-First Mode (Chrome 147+, Edge, etc.) can reach
# the local UI without disabling browser settings.
# `axum-server` wraps `tokio-rustls`; `rcgen` builds an
# in-memory self-signed cert for `--self-signed`.
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
sha2 = "0.10"
# Saga 21.5 step 004: reuse the CLI viz cache (is_svg_string
# detector + write_to_cache helper) for the server-side eval
# pipeline integration with `/v1/viz` storage.
mlpl-cli = { path = "../../../cli/crates/mlpl-cli" }
# rustls 0.23 requires an explicit crypto provider; pick
# `ring` (the historical default; aws-lc-rs is the
# alternative and has different licensing).
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
# Constant-time bearer-token compare; defends against
# timing oracles that could otherwise leak the token
# character-by-character.
subtle = "2"

# Saga R1 step 003: orchestrator forwards
# device("mlx") { ... } blocks to a registered peer
# via blocking reqwest. Async would force tokio into
# the eval crate's call site; blocking keeps the
# evaluator synchronous. The blocking feature
# coexists with the async client used by the
# tokio-based integration tests below.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "stream"] }
base64 = "0.22"
bincode = "1"

[dev-dependencies]
# Saga 21: tokio-based api_tests use the async
# reqwest client (still available alongside the
# blocking client enabled in [dependencies] above).
# Saga 21.5 step 010: persistence_tests roundtrip
# sessions through a tempfile.
tempfile = "3"
