[package]
name = "mlpl-serve-core"
edition.workspace = true
license.workspace = true
version.workspace = true

# Foundation of the serve crate family: auth, device listing, session
# store, TLS, the viz byte store, and the wire/response types. Split
# from mlpl-serve (tech-debt spike step 003).
[features]
# Forwarded from mlpl-serve's mlx/cuda features so
# `compiled_devices()` reports the real in-process device set.
mlx = []
cuda = []

[dependencies]
mlpl-eval = { path = "../../../eval/crates/mlpl-eval" }
mlpl-web-viz-ir = { path = "../../../web-viz-ir/crates/mlpl-web-viz-ir" }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"
rcgen = "0.13"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
subtle = "2"
base64 = "0.22"
mlpl-cli = { path = "../../../cli/crates/mlpl-cli" }
mlpl-monitor = { path = "../../../monitoring/crates/mlpl-monitor" }
mlpl-model-viz = { path = "../../../web-viz-ir/crates/mlpl-model-viz" }
