[package]
name = "mlpl-builtin-catalog"
description = "The curated builtin catalog behind :builtins / :describe and the docs-completeness tests -- static data only, split by domain"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[dependencies]

# build.rs parses catalog_lang.toml / catalog_ml.toml and generates the
# GROUPS consts into OUT_DIR, so the (name, sig, doc) rows live in data,
# not Rust source (docs/code_metrics.md section 15a). Build-only.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
