[package]
# Saga cuda-foundation step 005: traceable forward primitives in
# candle Tensor ops -- the CUDA analog of mlpl-mlx-forward (+ the
# lora_linear that lived in mlpl-mlx-train). Differentiable: candle
# autograd flows through every op, so the assembled demo model trains
# on the GPU. Linux/x86_64 + the `cuda` feature gate everything.
name = "mlpl-cuda-forward"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
cuda = ["dep:candle-core", "dep:candle-nn"]

# Target-gated so non-Linux `--features cuda` builds stub cleanly
# (cudarc needs nvcc at build time). See mlpl-cuda-rt/Cargo.toml.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
candle-core = { version = "0.9", optional = true, default-features = false, features = [
  "cuda",
] }
candle-nn = { version = "0.9", optional = true, default-features = false, features = [
  "cuda",
] }

[lints]
workspace = true
