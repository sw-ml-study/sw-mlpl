line_idx = 29
heading = "Training the 4-head Vision Transformer (~60-90s)"
body = "30 full-batch [[Adam]] steps on the 8 pet images. Same forward pipeline as the single-head quick demo, but `attention(128, 4)` runs four independent attention heads in parallel and `Tensor::stack` joins their per-head [T, d/h]=[16, 32] outputs back to [16, 128]. Backward fans through every head separately. The tab is unresponsive during the train block; this is normal, not a hang."

[[progress_notes]]
demo = "Pets: multi-head ViT (quick + viz)"
line_idx = 41
heading = "Rendering the four per-head attention maps"
body = """
Training is done. `attention_weights(attn, test_tokens)` returns a [4, 16, 16] tensor -- one [16, 16] softmax matrix per head over the 16 image patches. `svg(attn_maps, "heatmap_grid")` lays out a 2x2 grid of heatmaps with per-cell colormaps. Each cell shows what its head learned to pay attention to: row i column j is how much head h's i-th patch attends to the j-th patch.

What to look for: heads are NOT identical. One typically concentrates on a single column (a 'this patch is the salient one' signal); another spreads attention evenly (an 'aggregate everything' signal); the remaining two pick intermediate patterns. Compare with the untrained 'ViT Multi-Head Attention Pattern' demo where all four heads look uniformly random -- the differences here are entirely the work of gradient descent."""

[[progress_notes]]
demo = "Tiny LM + Engram"
line_idx = 10
heading = "Base training: 30 Adam steps (~seconds on the CPU)"
body = "Ordinary next-token training of the 1-block tiny LM on the byte corpus -- this is the reference model the engram will augment. Nothing engram-related has happened yet; the loss printed on the next line becomes the frozen-base yardstick every later number is compared against."

[[progress_notes]]
demo = "Tiny LM + Engram"
line_idx = 18
heading = "Engram-only training: 40 Adam steps against a frozen base"
body = "Every base weight was frozen two lines ago, so Adam skips them and the ONLY thing learning here is the engram: its memory table (via scatter-ADD into the bigram-addressed rows), value projection, and gate. When the loss comes out below the frozen-base reference, that whole margin was bought by conditional memory, not by weight updates."
