    "b2 = zeros([2])                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # output bias",
    "lr = 0.2                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            # learning rate",
    "repeat 600 { Z1 = matmul(X, W1) + matmul(ones([80, 1]), reshape(b1, [1, 8])); H = tanh_fn(Z1); Z2 = matmul(H, W2) + matmul(ones([80, 1]), reshape(b2, [1, 2])); P = softmax(Z2, 1); dZ2 = P - Y; gW2 = matmul(transpose(H), dZ2) / 80; gb2 = reduce_add(dZ2, 0) / 80; dH = matmul(dZ2, transpose(W2)); dZ1 = dH * (1 - H * H); gW1 = matmul(transpose(X), dZ1) / 80; gb1 = reduce_add(dZ1, 0) / 80; W1 = W1 - lr * gW1; b1 = b1 - lr * gb1; W2 = W2 - lr * gW2; b2 = b2 - lr * gb2 }  # 600 hand-rolled forward + backward steps; chain rule visible in dZ1 = dH * (1 - H*H)",
    "Z1 = matmul(X, W1) + matmul(ones([80, 1]), reshape(b1, [1, 8]))                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # final forward: hidden pre-activation",
    "H = tanh_fn(Z1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # hidden activation",
    "Z2 = matmul(H, W2) + matmul(ones([80, 1]), reshape(b2, [1, 2]))                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # output pre-activation",
    "P = softmax(Z2, 1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # row-wise probabilities",
    "mlp_pred = argmax(P, 1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # discrete class predictions",
    "mean(eq(mlp_pred, y))                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                # accuracy",
    "confusion_matrix(mlp_pred, y)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # 2x2 prediction-vs-actual",
    "G = grid([-4, 4, -4, 4], 30)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # 30x30 input-space grid",
    "GZ1 = matmul(G, W1) + matmul(ones([900, 1]), reshape(b1, [1, 8]))                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # grid forward: hidden pre-activation",
    "GH = tanh_fn(GZ1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # grid hidden activation",
    "GZ2 = matmul(GH, W2) + matmul(ones([900, 1]), reshape(b2, [1, 2]))                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # grid output pre-activation",
    "GP = softmax(GZ2, 1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # grid probabilities",
    "p1 = reshape(matmul(GP, [[0],[1]]), [900])                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # extract probability of class 1",
    "boundary_2d(p1, [30, 30], X, y)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # the decision surface that XOR needs",
]

[[demos]]
category = "APL2 / General Programming"
name = "Workspace Introspection"
intro = "APL2-inspired GENERAL-PURPOSE programming, not ML: workspace introspection is pure APL heritage. Tour of the REPL's introspection commands: :version, :wsid (workspace ID summary), :vars, :describe, :models, :fns, :experiments. Also shows how the axis-label annotation syntax (M : [batch, feat] = ...) shows up in :vars and :describe output. When connected to an mlpl-serve (?connect=<url>) you also get the connect-mode introspectors -- :status (live CPU/GPU/RAM), :connect list (the server's Ollama LLMs for :ask), and :ask itself. NOTE the difference: :models lists the MLPL model objects YOU built here; :connect list lists the server's LLMs for :ask -- they are not the same. To avoid repeating all of this, the demo does NOT run :introspect -- that one command bundles every no-arg inspector (and names the connect-mode ones) into one markdown-headered dump; run it yourself to see the whole snapshot in a single scroll."
takeaway = "You can always ask the REPL what's in your session. :describe on a variable prints shape + labels + a preview; on a model, the layer tree; on a builtin, the signature and one-line doc. :experiments shows every tracked run. Don't confuse :models (your workspace's MLPL models) with :connect list (the connected server's Ollama LLMs for :ask). When you want the lot in one shot rather than command-by-command, run :introspect -- it prints every no-arg inspector under `## :<topic>` headers with a trailing connect-mode section."
lines = [
    ":version                                                            # build banner: version + arch + commit + timestamp",
    ":wsid                                                                # workspace summary (var/param/model counts)",
    "x = 42                                                               # bind a scalar",
    "v = range(5)                                                          # bind a 5-vector",
    "M : [batch, feat] = reshape(range(6), [2, 3])                         # bind a labeled-axis matrix",
    ":vars                                                                # list all bound variables with shape + tag",
    ":describe v                                                          # shape + values preview for a variable",
    "mdl = chain(linear(2, 4, 11), relu_layer(), linear(4, 2, 12))        # bind a model",
    ":models                                                              # list bound models with layer trees",
    ":describe mdl                                                        # the layer tree for mdl",
    'tok = train_bpe("abababab", 260, 0)                                  # bind a tokenizer',
    ":describe tok                                                        # tokenizer info",
    "W = param[3, 2]                                                      # declare a trainable parameter",
    ":vars                                                                # see the [param] tag on W",
    ":wsid                                                                # parameter count went up",
    'experiment "workspace_demo" { loss_metric = 0.25; accuracy_metric = 0.94 }  # capture two metrics into the experiment registry',
    ":experiments                                                         # list every captured run",
    ":describe matmul                                                     # signature + one-line doc for a builtin",
    ":fns                                                                 # list user-defined functions (none yet)",
    ":status                                                              # connect mode: backend devices + live CPU/GPU/RAM (needs ?connect=)",
    ":connect list                                                        # connect mode: the server's Ollama LLMs for :ask -- NOT the :models above",
    ':ask "what have I built in this workspace so far?"',
]

[[demos]]
category = "Basics"
name = "Upload & Inspect Image"
intro = "How to bring your own image into MLPL. Type :upload x in the REPL to open your device's file picker. The browser decodes and resizes the photo to 64x64 and binds it as a Result -- Ok({pixels, h, w}) on success, Err(message) on cancel or decode failure. This demo simulates the workflow with synthetic pixel data so you can see the inspection pattern before trying :upload yourself."
