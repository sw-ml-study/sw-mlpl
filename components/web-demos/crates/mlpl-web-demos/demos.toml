[[demos]]
category = "APL2 / General Programming"
name = "User-Defined Functions"
intro = "APL2-inspired GENERAL-PURPOSE programming, not ML: def works for any program, ML or otherwise. Define your own functions with def. Names use a colon namespace: u: for user functions, vendor: for packages. Builtins (sin, range, adam) have no colon and cannot be shadowed. Function bodies are full programs, so the building blocks of ML fit naturally: a conditional is an activation, a for loop is a loss over a batch, a while loop is a training run, and recursion is a schedule. Bodies also get early return and access to outer variables."
takeaway = "def u:name(args) { body } defines a function; the last expression is the return value and return exits early. Statements are separated by ; or newlines, so a body can branch (if/else), loop (while, for ... in), recurse, and process array arguments. The examples below are the same primitives you would write by hand before reaching for the matmul / adam builtins: relu, an MSE loss, a gradient-descent step, and a decay schedule. Type :fns to list your defined functions."
lines = [
    "# A user function: relu, the classic activation -- a conditional",
    "def u:relu1(x) { \"relu: pass positives, zero the rest\"; if gt(x, 0) { x } else { 0 } }",
    "u:relu1(3)",
    "u:relu1(-2)",
    "# Mean squared error over a vector of residuals -- a for loop over an array arg",
    "def u:mse(errs) { \"mean squared error over a residual vector\"; s = 0; n = 0; for r in errs { s = s + r * r; n = n + 1 }; s / n }",
    "u:mse([1, -2, 0.5, -0.5])",
    "# One gradient-descent run minimizing (w - 3)^2 -- a while loop.",
    "# A MULTI-LINE def: interior # comments are KEPT in the definition",
    "def u:fit(w0, lr, steps) {\n    \"gradient descent on (w - 3)^2 from w0\";\n    w = w0;\n    i = 0;\n    while gt(steps, i) {\n        # d/dw (w - 3)^2 = 2(w - 3)\n        g = 2 * (w - 3);\n        # step downhill\n        w = w - lr * g;\n        i = i + 1\n    };\n    w\n}",
    "u:fit(0, 0.1, 50)",
    ":list u:fit                                          # the definition back AS WRITTEN -- doc-string AND # comments intact (APL2-style listing)",
    "# Learning-rate decay schedule lr * rate^steps -- recursion with a base case",
    "def u:decay(lr, rate, steps) { \"lr * rate^steps, by recursion\"; if gt(steps, 0) { u:decay(lr * rate, rate, steps - 1) } else { lr } }",
    "u:decay(0.1, 0.9, 10)",
    "# Numerically safe log(p) for cross-entropy -- early return guards log(0)",
    "def u:safe_log(p) { \"log(p) with a floor: early return guards log(0)\"; if gt(p, 0) { return log(p) } else { return -20 } }",
    "u:safe_log(0.5)",
    "u:safe_log(0)",
    "# List all defined functions -- each shows its doc-string",
    ":fns",
]

[[demos]]
category = "Basics"
name = "Visualizations"
intro = "A tour of every plot you can call directly, each rendered from a tiny synthetic input. The trailing comment on each line says what the visualization is for and which other demos use it. Two families: the low-level svg() primitives (you pass a data array and a type string) and the higher-level analysis helpers (loss_curve, confusion_matrix, and friends, which take meaningful arguments and add axes/labels). A download button next to each SVG saves it as a file."
takeaway = "Pick a visualization by the shape of your data; there is no plotting API to learn beyond that. Rendered above: scatter / scatter3d / line / bar / heatmap (svg primitives) and hist / scatter_labeled / loss_curve / train_val_curve / loss_landscape / confusion_matrix / boundary_2d (analysis helpers). A few richer views need real model or image data, so they live in their own demos rather than here: a heatmap becomes an ATTENTION PATTERN in the Self/Cross/Multi-Head Attention and Encoder/Decoder demos; heatmap_grid shows one panel per head in the multi-head attention + ViT demos; gallery shows image thumbnails in the Pets demos and Upload & Inspect Image; waffle is the before/after category grid in the tic-tac-toe fine-tunes; PCA 3D has an interactive (rotatable) 3D scatter; and any demo can be viewed as a 3D sculpture with a Sankey model graph via the 3D toggle."
lines = [
    'svg([[0,0],[1,1],[2,4],[3,9],[4,16]], "scatter")  # SHOWS: 5 points (x, x-squared), one circle per row of an Nx2 array. USE: see the raw geometry of 2D data -- clusters, generated samples, projections. DEMOS: K-Means, GAN (2D circle), Diffusion (2D points).',
    'svg([[0,0,0],[1,2,1],[2,0,2],[3,3,1],[1,1,3]], "scatter3d")  # SHOWS: 5 points in 3D, orthographic projection. USE: inspect 3D data or a 3-component embedding. DEMOS: this static form here; PCA 3D (interactive) is the rotatable version.',
    'svg([5, 3, 4, 2, 3, 1, 2, 1], "line")  # SHOWS: an 8-value sequence as a polyline. USE: any 1D series over an index -- a metric, a signal, a parameter sweep. DEMOS: Loss Curve, the loss-vs-weight sweep in Logistic Regression.',
    'svg([3, 1, 4, 1, 5, 9, 2, 6], "bar")  # SHOWS: 8 values as vertical bars. USE: compare magnitudes across discrete categories or items. DEMOS: Logistic Regression (per-point predictions), Gradient Flow (per-layer gradient magnitudes).',
    'svg(reshape(range(36), [6, 6]), "heatmap")  # SHOWS: a 6x6 matrix as a viridis grid (purple=low, yellow=high). USE: visualize any matrix -- a covariance, a weight matrix, attention scores. DEMOS: every attention-pattern demo (Self / Cross / Multi-Head Attention, Encoder / Decoder Block).',
    "hist(randn(1, [200]), 20)  # SHOWS: 200 standard-normal samples binned into 20 bars. USE: see the distribution and spread of a vector before modeling. DEMOS: Analysis Helpers, Upload & Inspect Image (pixel values).",
    "vpts = randn(1, [40, 2])  # (setup) 40 random 2D points to color in the next line",
    "scatter_labeled(vpts, gt(take(transpose(vpts), 0, 0), 0))  # SHOWS: 40 points colored into two classes by the sign of their x-coordinate, with a legend. USE: color points by class or cluster id to see how well groups separate. DEMOS: K-Means, PCA, UMAP vs PCA, Dim-reduction zoo.",
    "loss_curve([4, 2.5, 1.7, 1.2, 0.9, 0.7, 0.6, 0.55])  # SHOWS: a loss falling from 4.0 to 0.55 over 8 steps, with min/max axis labels. USE: confirm training is converging (and how fast). DEMOS: Moons MLP, Tiny LM, the MLX / CUDA LoRA fine-tunes, How Gradient Descent Works.",
    "train_val_curve([1.5, 0.9, 0.6, 0.4, 0.3], [1.5, 1.0, 0.9, 1.0, 1.2])  # SHOWS: training loss (green dashed) falling while validation loss (peach dotted) bottoms out and turns up -- the gap IS overfitting. USE: detect overfitting by comparing train vs held-out loss. DEMOS: Watch a Model Learn / Generalize, Taming Overfitting: Weight Decay.",
    "vsurf = reduce_add(grid([-2, 2, -2, 2], 12) * grid([-2, 2, -2, 2], 12), 1)  # (setup) a bowl-shaped loss surface, value = x-squared + y-squared",
    "loss_landscape(vsurf, [12, 12], [[0.9, 0.9], [0.7, 0.7], [0.5, 0.6], [0.5, 0.5]])  # SHOWS: the 2-weight loss surface as a heatmap (dark = low) with a white optimizer path walking into the basin (green start dot, red end dot). USE: make gradient descent concrete for a 2-parameter model. DEMOS: How Gradient Descent Works, Learning Rate: too big, too small, just right.",
    "confusion_matrix([0, 1, 2, 1, 0, 2, 1], [0, 1, 1, 1, 0, 2, 2])  # SHOWS: a 3x3 grid of predicted-vs-actual class counts -- the diagonal is correct, off-diagonal is errors. USE: see WHICH classes a model confuses, not just overall accuracy. DEMOS: Softmax Classifier, Moons MLP, Tiny MLP.",
    "boundary_2d(range(400) / 400, [20, 20], [[5, 5], [15, 15]], [0, 1])  # SHOWS: a 20x20 classifier-confidence surface (a ramp here) with two labeled training points overlaid. USE: see the decision region a trained classifier carves in input space. DEMOS: Moons MLP, Softmax Classifier, Tiny MLP.",
]

[[demos]]
category = "Training & Learning"
name = "Watch a Model Learn (overfitting)"
intro = "Training is a process, not a single result -- so watch it happen. An over-capacity MLP (two 32-wide hidden layers, ~1300 weights) trains on just 30 noisy 'moons' points while a separate 200-point validation set scores it every few steps. Both losses are plotted on one chart with [[train_val_curve]]: the green dashed training curve and the peach dotted validation curve. The chart is rendered once at the halfway mark and again at the end so you see the two lines pull apart."
takeaway = "The gap between the green dashed line and the peach dotted line IS overfitting. Early on both fall together -- the model is learning real structure shared by train and validation. Then the training loss keeps dropping (often all the way toward zero) while the validation loss flattens and usually turns back up: past that point the network is memorizing the 30 training points' noise instead of the underlying shape, so it does WORSE on data it has not seen. A small/noisy training set plus a high-capacity model is the classic recipe; the cures are more data, fewer parameters, or regularization (dropout, weight decay, early stopping). The companion demo 'Watch a Model Generalize (no overfitting)' applies the first two cures and shows the gap close; 'How Gradient Descent Works' shows the training loop underneath, one step at a time."
lines = [
    "Mtr = moons(7, 30, 0.30)                      # tiny, noisy training set -- easy to memorize",
    "Xtr = matmul(Mtr, [[1,0],[0,1],[0,0]])        # [30, 2] inputs",
    "ytr = reshape(matmul(Mtr, [[0],[0],[1]]), [30])   # [30] integer labels",
    "Mva = moons(101, 200, 0.30)                   # large held-out validation set (unseen points)",
    "Xva = matmul(Mva, [[1,0],[0,1],[0,0]])        # [200, 2] inputs",
    "yva = reshape(matmul(Mva, [[0],[0],[1]]), [200])  # [200] labels",
    "mdl = chain(linear(2, 32, 1), tanh_layer(), linear(32, 32, 2), tanh_layer(), linear(32, 2, 3))  # over-capacity for 30 points",
    "trh = []                                      # training loss, recorded after each epoch (skip the untrained value -- it would squash the axis)",
    "vah = []                                      # validation loss, same",
    "train 25 { adam(cross_entropy(apply(mdl, Xtr), ytr), mdl, 0.04, 0.9, 0.999, 0.00000001); cross_entropy(apply(mdl, Xtr), ytr) }  # epoch 1",
    "trh = concat(trh, [cross_entropy(apply(mdl, Xtr), ytr)])",
    "vah = concat(vah, [cross_entropy(apply(mdl, Xva), yva)])",
    "train 25 { adam(cross_entropy(apply(mdl, Xtr), ytr), mdl, 0.04, 0.9, 0.999, 0.00000001); cross_entropy(apply(mdl, Xtr), ytr) }  # epoch 2",
    "trh = concat(trh, [cross_entropy(apply(mdl, Xtr), ytr)])",
    "vah = concat(vah, [cross_entropy(apply(mdl, Xva), yva)])",
    "train 25 { adam(cross_entropy(apply(mdl, Xtr), ytr), mdl, 0.04, 0.9, 0.999, 0.00000001); cross_entropy(apply(mdl, Xtr), ytr) }  # epoch 3",
    "trh = concat(trh, [cross_entropy(apply(mdl, Xtr), ytr)])",
    "vah = concat(vah, [cross_entropy(apply(mdl, Xva), yva)])",
    "train_val_curve(trh, vah)                     # halfway: lines still close",
    "train 25 { adam(cross_entropy(apply(mdl, Xtr), ytr), mdl, 0.04, 0.9, 0.999, 0.00000001); cross_entropy(apply(mdl, Xtr), ytr) }  # epoch 4",
    "trh = concat(trh, [cross_entropy(apply(mdl, Xtr), ytr)])",
    "vah = concat(vah, [cross_entropy(apply(mdl, Xva), yva)])",
    "train 25 { adam(cross_entropy(apply(mdl, Xtr), ytr), mdl, 0.04, 0.9, 0.999, 0.00000001); cross_entropy(apply(mdl, Xtr), ytr) }  # epoch 5",
    "trh = concat(trh, [cross_entropy(apply(mdl, Xtr), ytr)])",
    "vah = concat(vah, [cross_entropy(apply(mdl, Xva), yva)])",
    "train 25 { adam(cross_entropy(apply(mdl, Xtr), ytr), mdl, 0.04, 0.9, 0.999, 0.00000001); cross_entropy(apply(mdl, Xtr), ytr) }  # epoch 6",
    "trh = concat(trh, [cross_entropy(apply(mdl, Xtr), ytr)])",
    "vah = concat(vah, [cross_entropy(apply(mdl, Xva), yva)])",
    "train_val_curve(trh, vah)                     # final: training keeps falling, validation pulls away",
    "trfinal = cross_entropy(apply(mdl, Xtr), ytr) # final training loss (low)",
    "trfinal",
    "vafinal = cross_entropy(apply(mdl, Xva), yva) # final validation loss (higher -- the gap)",
    "vafinal",
]

[[demos]]
category = "Training & Learning"
name = "Watch a Model Generalize (no overfitting)"
intro = "The companion to 'Watch a Model Learn (overfitting)' -- same idea, fixed. That demo starved a big network on 30 noisy points and watched validation loss peel away. Here we apply the cures: a much larger training set (200 points) and a right-sized model (a single 16-unit hidden layer, ~80 weights instead of ~1300). We train in five short bursts, scoring a separate 200-point validation set after each, and plot both losses with [[train_val_curve]]. This time the two lines fall together and stay together."
takeaway = "Good training looks like this: the green dashed (train) and peach dotted (validation) curves descend side by side and both settle low -- the small, stable gap between them is healthy generalization, not overfitting. The difference from the overfitting demo is not a cleverer optimizer; it is the data-to-capacity balance. With enough examples relative to its number of weights, the network has to learn the real shape of the moons (which transfers to unseen points) because it cannot memorize 200 points the way it memorized 30. Final validation accuracy prints near 0.9+. The takeaways: more data and a model sized to the problem are the first and cheapest defenses against overfitting. See 'Watch a Model Learn (overfitting)' for the failure this fixes, and 'How Gradient Descent Works' for the downhill walk every training step is doing."
lines = [
    "Mtr = moons(7, 200, 0.20)                     # 200 training points -- plenty of data",
    "Xtr = matmul(Mtr, [[1,0],[0,1],[0,0]])        # [200, 2] inputs",
    "ytr = reshape(matmul(Mtr, [[0],[0],[1]]), [200])  # [200] labels",
    "Mva = moons(23, 200, 0.20)                    # 200 separate validation points",
    "Xva = matmul(Mva, [[1,0],[0,1],[0,0]])        # [200, 2] inputs",
    "yva = reshape(matmul(Mva, [[0],[0],[1]]), [200])  # [200] labels",
    "mdl = chain(linear(2, 16, 1), tanh_layer(), linear(16, 2, 2))  # right-sized: one 16-unit hidden layer",
    "trh = []                                      # training loss, recorded after each epoch (not the huge untrained value, which would squash the axis)",
    "vah = []                                      # validation loss, same",
    "train 20 { adam(cross_entropy(apply(mdl, Xtr), ytr), mdl, 0.06, 0.9, 0.999, 0.00000001); cross_entropy(apply(mdl, Xtr), ytr) }  # epoch 1",
    "trh = concat(trh, [cross_entropy(apply(mdl, Xtr), ytr)])",
    "vah = concat(vah, [cross_entropy(apply(mdl, Xva), yva)])",
    "train 20 { adam(cross_entropy(apply(mdl, Xtr), ytr), mdl, 0.06, 0.9, 0.999, 0.00000001); cross_entropy(apply(mdl, Xtr), ytr) }  # epoch 2",
    "trh = concat(trh, [cross_entropy(apply(mdl, Xtr), ytr)])",
    "vah = concat(vah, [cross_entropy(apply(mdl, Xva), yva)])",
    "train 20 { adam(cross_entropy(apply(mdl, Xtr), ytr), mdl, 0.06, 0.9, 0.999, 0.00000001); cross_entropy(apply(mdl, Xtr), ytr) }  # epoch 3",
    "trh = concat(trh, [cross_entropy(apply(mdl, Xtr), ytr)])",
    "vah = concat(vah, [cross_entropy(apply(mdl, Xva), yva)])",
    "train_val_curve(trh, vah)                     # halfway: both curves falling together",
    "train 20 { adam(cross_entropy(apply(mdl, Xtr), ytr), mdl, 0.06, 0.9, 0.999, 0.00000001); cross_entropy(apply(mdl, Xtr), ytr) }  # epoch 4",
    "trh = concat(trh, [cross_entropy(apply(mdl, Xtr), ytr)])",
    "vah = concat(vah, [cross_entropy(apply(mdl, Xva), yva)])",
    "train 20 { adam(cross_entropy(apply(mdl, Xtr), ytr), mdl, 0.06, 0.9, 0.999, 0.00000001); cross_entropy(apply(mdl, Xtr), ytr) }  # epoch 5",
    "trh = concat(trh, [cross_entropy(apply(mdl, Xtr), ytr)])",
    "vah = concat(vah, [cross_entropy(apply(mdl, Xva), yva)])",
    "train_val_curve(trh, vah)                     # final: train and validation stay close and low",
    "preds = argmax(softmax(apply(mdl, Xva), 1), 1)  # predicted class per validation point",
    "val_accuracy = mean(eq(preds, yva))           # fraction correct on UNSEEN data",
    "val_accuracy",
]

[[demos]]
category = "Training & Learning"
name = "Taming Overfitting: Weight Decay"
intro = "The third cure for overfitting, after 'more data' and 'a smaller model': regularization. We take an over-capacity net (a 32-unit hidden layer, ~130 weights) and the same tiny 30-point noisy dataset that made 'Watch a Model Learn (overfitting)' memorize -- but add an L2 penalty to the loss: lam * sum(W*W). That term punishes large weights, so the optimizer can lower the loss either by fitting the data or by shrinking the weights, and shrinking wins on the noise. We score a held-out 200-point set and plot both losses with [[train_val_curve]]."
takeaway = "The penalty keeps the weights small, and a small-weight network is a simpler function that cannot carve itself around individual noisy points -- so the green dashed (train) and peach dotted (validation) curves stay close instead of pulling apart, and validation accuracy on unseen data lands around 0.8. This is the same over-capacity model that overfit in 'Watch a Model Learn (overfitting)'; the only change is the lam * sum(W*W) term in the loss. Bigger lam means a simpler model (more bias, less variance); too big and it underfits. Weight decay, dropout, and early stopping are the standard regularizers -- this is the simplest, and it is one extra term."
lines = [
    "Mtr = moons(7, 30, 0.30)                      # the same tiny, noisy training set that overfit before",
    "Xtr = matmul(Mtr, [[1,0],[0,1],[0,0]])",
    "ytr = reshape(matmul(Mtr, [[0],[0],[1]]), [30])",
    "Mva = moons(101, 200, 0.30)                   # 200 held-out validation points",
    "Xva = matmul(Mva, [[1,0],[0,1],[0,0]])",
    "yva = reshape(matmul(Mva, [[0],[0],[1]]), [200])",
    "O30 = ones([30, 1])                           # bias-broadcast helpers",
    "O200 = ones([200, 1])",
    "W1 = param[2, 32]                             # over-capacity: a 32-unit hidden layer (declares trainable)",
    "b1 = param[1, 32]",
    "W2 = param[32, 2]",
    "b2 = param[1, 2]",
    "W1 = randn(11, [2, 32]) * 0.5                 # seeded init",
    "W2 = randn(12, [32, 2]) * 0.5",
    "lam = 0.03                                    # weight-decay strength (the L2 penalty coefficient)",
    "trh = []",
    "vah = []",
    "train 25 { adam(cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) + lam * (sum(W1 * W1) + sum(W2 * W2)), [W1, b1, W2, b2], 0.05, 0.9, 0.999, 0.00000001); cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) }  # epoch 1: loss = data loss + L2 penalty",
    "trh = concat(trh, [cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr)])  # record the DATA loss only",
    "vah = concat(vah, [cross_entropy(matmul(tanh_fn(matmul(Xva, W1) + matmul(O200, b1)), W2) + matmul(O200, b2), yva)])",
    "train 25 { adam(cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) + lam * (sum(W1 * W1) + sum(W2 * W2)), [W1, b1, W2, b2], 0.05, 0.9, 0.999, 0.00000001); cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) }  # epoch 2",
    "trh = concat(trh, [cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr)])",
    "vah = concat(vah, [cross_entropy(matmul(tanh_fn(matmul(Xva, W1) + matmul(O200, b1)), W2) + matmul(O200, b2), yva)])",
    "train 25 { adam(cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) + lam * (sum(W1 * W1) + sum(W2 * W2)), [W1, b1, W2, b2], 0.05, 0.9, 0.999, 0.00000001); cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) }  # epoch 3",
    "trh = concat(trh, [cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr)])",
    "vah = concat(vah, [cross_entropy(matmul(tanh_fn(matmul(Xva, W1) + matmul(O200, b1)), W2) + matmul(O200, b2), yva)])",
    "train_val_curve(trh, vah)                     # halfway: train and validation tracking together",
    "train 25 { adam(cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) + lam * (sum(W1 * W1) + sum(W2 * W2)), [W1, b1, W2, b2], 0.05, 0.9, 0.999, 0.00000001); cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) }  # epoch 4",
    "trh = concat(trh, [cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr)])",
    "vah = concat(vah, [cross_entropy(matmul(tanh_fn(matmul(Xva, W1) + matmul(O200, b1)), W2) + matmul(O200, b2), yva)])",
    "train 25 { adam(cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) + lam * (sum(W1 * W1) + sum(W2 * W2)), [W1, b1, W2, b2], 0.05, 0.9, 0.999, 0.00000001); cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) }  # epoch 5",
    "trh = concat(trh, [cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr)])",
    "vah = concat(vah, [cross_entropy(matmul(tanh_fn(matmul(Xva, W1) + matmul(O200, b1)), W2) + matmul(O200, b2), yva)])",
    "train 25 { adam(cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) + lam * (sum(W1 * W1) + sum(W2 * W2)), [W1, b1, W2, b2], 0.05, 0.9, 0.999, 0.00000001); cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr) }  # epoch 6",
    "trh = concat(trh, [cross_entropy(matmul(tanh_fn(matmul(Xtr, W1) + matmul(O30, b1)), W2) + matmul(O30, b2), ytr)])",
    "vah = concat(vah, [cross_entropy(matmul(tanh_fn(matmul(Xva, W1) + matmul(O200, b1)), W2) + matmul(O200, b2), yva)])",
    "train_val_curve(trh, vah)                     # final: the gap stayed small -- the penalty tamed it",
    "preds = argmax(softmax(matmul(tanh_fn(matmul(Xva, W1) + matmul(O200, b1)), W2) + matmul(O200, b2), 1), 1)",
    "val_accuracy = mean(eq(preds, yva))           # accuracy on unseen data (~0.8, despite the over-capacity net)",
    "val_accuracy",
]

[[demos]]
category = "Training & Learning"
name = "Learning Rate: too big, too small, just right"
intro = "The learning rate is the size of each downhill step, and it is the single most important knob in training. We reuse the loss surface from 'How Gradient Descent Works' (fitting y = w*x + b) and run gradient descent from the SAME bad starting guess three times, changing only the step size. The white path on each [[loss_landscape]] shows what happens."
takeaway = "Too small (0.003): the steps are so tiny the path barely leaves the start -- it would get there eventually, but you would wait forever and waste compute. Just right (0.15): the path walks straight down into the dark basin in a handful of steps. Too big (0.7): each step overshoots the minimum so badly that the loss grows instead of shrinking -- the path zig-zags and flies off the chart as the weights blow up (NaNs, in a real run). The usable range is wide but bounded; people find it by trying a few values an order of magnitude apart, or use a schedule that starts higher and decays. Adam (in the other demos) adapts an effective step per weight, which makes it far more forgiving than this raw gradient descent."
lines = [
    "x = linspace(-2, 2, 11)",
    "y = 2 * x + 1 + randn(5, [11]) * 0.3          # the same noisy line as 'How Gradient Descent Works'",
    "G = grid([-1, 5, -3, 3], 28)                  # 28x28 grid of (w, b) guesses",
    "wcol = reshape(take(transpose(G), 0, 0), [784, 1])",
    "bcol = reshape(take(transpose(G), 0, 1), [784, 1])",
    "preds = matmul(wcol, reshape(x, [1, 11])) + matmul(bcol, ones([1, 11]))",
    "resid = preds - matmul(ones([784, 1]), reshape(y, [1, 11]))",
    "surf = reduce_add(resid * resid, 1) / 11      # the shared loss surface (dark = low loss)",
    "w = 4.5                                       # TOO SMALL (lr = 0.003): the path barely moves",
    "b = -2.5",
    "path = [[w, b]]",
    "repeat 40 { e = (w * x + b) - y; dw = mean(e * x) * 2; db = mean(e) * 2; w = w - 0.003 * dw; b = b - 0.003 * db; path = concat(path, [[w, b]], 0) }",
    "pathn = (path - matmul(ones([41, 1]), [[-1, -3]])) / matmul(ones([41, 1]), [[6, 6]])",
    "loss_landscape(surf, [28, 28], pathn)         # too small: stuck near the start",
    "w = 4.5                                       # JUST RIGHT (lr = 0.15): straight down into the basin",
    "b = -2.5",
    "path = [[w, b]]",
    "repeat 40 { e = (w * x + b) - y; dw = mean(e * x) * 2; db = mean(e) * 2; w = w - 0.15 * dw; b = b - 0.15 * db; path = concat(path, [[w, b]], 0) }",
    "pathn = (path - matmul(ones([41, 1]), [[-1, -3]])) / matmul(ones([41, 1]), [[6, 6]])",
    "loss_landscape(surf, [28, 28], pathn)         # just right: reaches the dark basin",
    "w = 4.5                                       # TOO BIG (lr = 0.7): overshoots and diverges",
    "b = -2.5",
    "path = [[w, b]]",
    "repeat 40 { e = (w * x + b) - y; dw = mean(e * x) * 2; db = mean(e) * 2; w = w - 0.7 * dw; b = b - 0.7 * db; path = concat(path, [[w, b]], 0) }",
    "pathn = (path - matmul(ones([41, 1]), [[-1, -3]])) / matmul(ones([41, 1]), [[6, 6]])",
    "loss_landscape(surf, [28, 28], pathn)         # too big: zig-zags off the chart",
]

[[demos]]
category = "Training & Learning"
name = "Gradient Flow (backprop)"
intro = "Training updates every weight by its gradient -- but where do those gradients come from? Backpropagation: the error at the output is sent BACKWARD through the network, layer by layer, and each layer's gradient is the running product of the layers above it. We build a deep 4-layer net with sigmoid activations, read each layer's gradient with grad(), and chart the magnitudes. The bars make 'backprop' concrete: a real number per layer saying how big a learning signal it received."
takeaway = "The bars shrink toward the input (left): the output layer (rightmost) gets a gradient many times larger than the first layer's. That is the vanishing-gradient problem -- backprop multiplies a sigmoid derivative (at most 0.25) at every layer, so after a few layers the signal is tiny and the early layers barely learn. It is exactly why deep networks were hard to train until three fixes arrived: non-saturating activations (ReLU, whose derivative is 1, not 0.25), residual/skip connections that let the gradient bypass layers, and normalization. Note grad() needs the whole forward written inline -- it computes the gradient of one expression, it cannot trace a stored value back to a weight."
lines = [
    "M = moons(7, 40, 0.2)                         # a small dataset -- we only need ONE backward pass",
    "X = matmul(M, [[1,0],[0,1],[0,0]])",
    "y = reshape(matmul(M, [[0],[0],[1]]), [40])",
    "O = ones([40, 1])                             # bias-broadcast column",
    "W1 = param[2, 12]                             # a deep net: 4 weight layers (declares trainable)",
    "b1 = param[1, 12]",
    "W2 = param[12, 12]",
    "b2 = param[1, 12]",
    "W3 = param[12, 12]",
    "b3 = param[1, 12]",
    "W4 = param[12, 2]",
    "b4 = param[1, 2]",
    "W1 = randn(1, [2, 12])                        # seeded random init",
    "W2 = randn(2, [12, 12])",
    "W3 = randn(3, [12, 12])",
    "W4 = randn(4, [12, 2])",
    "g1 = grad(cross_entropy(matmul(sigmoid(matmul(sigmoid(matmul(sigmoid(matmul(X, W1) + matmul(O, b1)), W2) + matmul(O, b2)), W3) + matmul(O, b3)), W4) + matmul(O, b4), y), W1)  # gradient at the INPUT layer (whole forward inline)",
    "m1 = sqrt(reduce_add(g1 * g1))                # its magnitude (length of the gradient vector)",
    "g2 = grad(cross_entropy(matmul(sigmoid(matmul(sigmoid(matmul(sigmoid(matmul(X, W1) + matmul(O, b1)), W2) + matmul(O, b2)), W3) + matmul(O, b3)), W4) + matmul(O, b4), y), W2)",
    "m2 = sqrt(reduce_add(g2 * g2))",
    "g3 = grad(cross_entropy(matmul(sigmoid(matmul(sigmoid(matmul(sigmoid(matmul(X, W1) + matmul(O, b1)), W2) + matmul(O, b2)), W3) + matmul(O, b3)), W4) + matmul(O, b4), y), W3)",
    "m3 = sqrt(reduce_add(g3 * g3))",
    "g4 = grad(cross_entropy(matmul(sigmoid(matmul(sigmoid(matmul(sigmoid(matmul(X, W1) + matmul(O, b1)), W2) + matmul(O, b2)), W3) + matmul(O, b3)), W4) + matmul(O, b4), y), W4)  # gradient at the OUTPUT layer",
    "m4 = sqrt(reduce_add(g4 * g4))",
    "svg([m1, m2, m3, m4], \"bar\")                  # one bar per layer: input (left) -> output (right)",
]

[[demos]]
category = "Basics"
name = "BPE-Labeled Attention Pattern"
intro = "Tokenize a short text with train_bpe + apply_tokenizer, decode each token id back to its byte string via decode_each, then run attention on the embedded sequence. Click the `A` sculpture (rank-3 [heads, T, T] attention weights) and the heatmap axes label rows + columns with the actual BPE pieces -- not integer indices -- because `labels = decode_each(...)` rode through the ShapeInfo.string_list channel into the next attention sculpture."
takeaway = "Per-token visualization needs the per-token labels alongside the data. decode_each is the BPE-side counterpart to decode (which collapses the whole id sequence into one string); the viz plumbing in ShapeInfo carries the resulting StrList forward so the next attention heatmap renders with real tokens on its axes. Untrained: the heatmap is randn noise; the point here is that the labels flow, not that the model knows anything."
lines = [
    "# End-to-end BPE labels on an attention heatmap.",
    'corpus = "the quick brown fox jumps over the lazy dog"      # 9 ASCII words',
    "tok    = train_bpe(corpus, 80, 0)                            # 80 merges -> multi-char tokens emerge",
    "ids    = apply_tokenizer(tok, corpus)                        # rank-1 token ids",
    "labels = decode_each(tok, ids)                                # StrList: per-token byte strings",
    "# Above `labels` rides through ShapeInfo.string_list and is",
    "# attached to the NEXT attention sculpture as its axis labels.",
    "d = 16                                                         # embedding dim",
    "V = 300                                                        # max vocab id + slack (BPE vocab = 256 + merges)",
    "emb = embed(V, d, 1)                                          # embedding layer",
    "seq = apply(emb, ids)                                         # [N, d] embedded sequence",
    "# Two-head attention, max sequence length 64 (well above the corpus length).",
    "mdl    = attention(d, 2, 64)",
    "A      = attention_weights(mdl, seq)                          # [2, N, N]",
    'svg(A, "heatmap_grid")                                       # peek before clicking',
    "# Click the `A` sculpture in the 3D stage -- the dialog should",
    "# show real BPE pieces on the axes instead of 0..N-1.",
]

[[demos]]
category = "Vision"
name = "ViT Attention Pattern (no training)"
intro = "Vision [[Transformer]] pipeline end-to-end on a synthetic 64x64 RGB image, no training. patchify(x, 16) cuts the image into a 4x4 grid of 16 patches; each patch flattens P*P*C = 768 floats. A linear projection embeds them to d_model=128, a randn CLS token is prepended via concat(cls, patches, 0), a randn positional embedding is added, and one attention head computes its softmax weight matrix [17, 17] (16 patch tokens + 1 CLS). The heatmap is what an UNTRAINED ViT head pays attention to -- essentially nothing useful. The 'Pets: cat vs dog (quick)' demo trains the same architecture on pets_tiny."
takeaway = "The ViT recipe is shorter than it looks: patchify + linear-embed + CLS-prepend + pos-add + attention. Five new builtins (patchify, concat axis 0, randn, matmul, softmax) compose into the same forward-pass topology the original ViT paper drew. Without training, the attention weights are random; the row-sum sanity check at the end confirms softmax did its job regardless."
lines = [
    "img = randn(101, [1, 3, 64, 64])                       # one synthetic 64x64 RGB image",
    "tokens_4d = patchify(img, 16)                          # [1, 16, 768] -- 4x4 grid of P*P*C patches",
    "tokens    = reshape(tokens_4d, [16, 768])              # drop the singleton batch dim",
    "Wp        = randn(201, [768, 128]) / sqrt(768)         # linear patch embedding to d_model = 128",
    "patches   = matmul(tokens, Wp)                         # [16, 128]",
    "cls = randn(301, [1, 128])                             # learnable CLS token (randn for the no-training demo)",
    "seq_no_pos = concat(cls, patches, 0)                   # prepend CLS along the sequence axis -> [17, 128]",
    "pos = randn(401, [17, 128])                            # positional embedding",
    "seq = seq_no_pos + pos                                 # add positions",
    "Wq = randn(501, [128, 128]) / sqrt(128)                # one attention head, d_k = 128",
    "Wk = randn(502, [128, 128]) / sqrt(128)",
    "q  = matmul(seq, Wq)",
    "k  = matmul(seq, Wk)",
    "scores = matmul(q, transpose(k)) / sqrt(128)           # scaled dot-product",
    "A = softmax(scores, 1)                                 # row-stochastic attention pattern [17, 17]",
    'svg(A, "heatmap")                                    # render the heatmap',
    "row_sums = reduce_add(A, 1)                            # sanity: every row sums to 1.0",
    "row_sums",
]

[[demos]]
category = "Vision"
name = "Pets: cat vs dog (quick)"
intro = "Trained [[ViT (Vision Transformer)]] end-to-end on a balanced 8-image subset of [[Oxford-IIIT Pet dataset]] (4 cats + 4 dogs). 30 full-batch [[Adam]] steps with single-head [[Attention]] (`attention(128, 1)`) and a tiny [[MLP (Multi-Layer Perceptron)]] classifier head. The longer 20-image / 100-step version lives in `demos/vit_single_head_quick.mlpl`; this in-browser variant is scaled down so the train loop completes in seconds. The 30 adam steps run as 6 chunks of `train 5 { ... }` so the browser tab stays responsive between chunks (a single `train 30` would block the WASM thread for the whole run)."
takeaway = "ViT in MLPL is the same five-step recipe as the no-training demo plus a [[Train (loop)]] and an [[Adam]] call. The forward expression has to be inlined into [[Adam]] because [[Backpropagation]] walks the expression tree (let-bindings would create non-differentiable leaves). First-token pooling stands in for a learned CLS token. Each `train 5` chunk overwrites `last_losses`, so the demo accumulates `all_losses = concat(all_losses, last_losses, 0)` between chunks; Adam momentum persists across chunks via the session env, so this is mathematically identical to a single `train 30`. The loss curve at the end shows binary [[Cross entropy]] falling from ~0.69 (random) toward 0 (overfit); the final accuracy on the 8 training images is the scalar at the very bottom."
lines = [
    "# Balanced 8-image subset (4 cats + 4 dogs) extracted",
    "# from pets_tiny via take + concat.",
    'pets = load_preloaded("pets_tiny")',
    "c0 = reshape(take(pets.X, 0, 0), [1, 3, 64, 64])",
    "c1 = reshape(take(pets.X, 0, 1), [1, 3, 64, 64])",
    "c2 = reshape(take(pets.X, 0, 2), [1, 3, 64, 64])",
    "c3 = reshape(take(pets.X, 0, 3), [1, 3, 64, 64])",
    "d0 = reshape(take(pets.X, 0, 100), [1, 3, 64, 64])",
    "d1 = reshape(take(pets.X, 0, 101), [1, 3, 64, 64])",
    "d2 = reshape(take(pets.X, 0, 102), [1, 3, 64, 64])",
    "d3 = reshape(take(pets.X, 0, 103), [1, 3, 64, 64])",
    "cats = concat(concat(concat(c0, c1, 0), c2, 0), c3, 0)",
    "dogs = concat(concat(concat(d0, d1, 0), d2, 0), d3, 0)",
    "X    = concat(cats, dogs, 0)                                # [8, 3, 64, 64]",
    "ly0 = reshape(take(pets.Y, 0, 0),   [1])",
    "ly1 = reshape(take(pets.Y, 0, 1),   [1])",
    "ly2 = reshape(take(pets.Y, 0, 2),   [1])",
    "ly3 = reshape(take(pets.Y, 0, 3),   [1])",
    "ld0 = reshape(take(pets.Y, 0, 100), [1])",
    "ld1 = reshape(take(pets.Y, 0, 101), [1])",
    "ld2 = reshape(take(pets.Y, 0, 102), [1])",
    "ld3 = reshape(take(pets.Y, 0, 103), [1])",
    "ycats = concat(concat(concat(ly0, ly1, 0), ly2, 0), ly3, 0)",
    "ydogs = concat(concat(concat(ld0, ld1, 0), ld2, 0), ld3, 0)",
    "Y     = concat(ycats, ydogs, 0)                             # [8] -- 0=cat, 1=dog",
    "# Model layers.",
    "linear_p   = linear(768, 128, 17)                            # patch embedding",
    "attn       = attention(128, 1, 23)                           # single-head, d_model=128",
    "classifier = chain(linear(128, 64, 31), relu_layer(), linear(64, 2, 37))",
    "# 30 full-batch adam steps run as 6 train blocks of 5",
    "# steps each, so the browser tab stays responsive (the",
    "# REPL yields between lines but cannot interrupt a",
    "# single long train). Adam momentum persists across the",
    "# chunks via the session env -- mathematically identical",
    "# to one train 30. Forward pipeline:",
    "#   patchify(X, 16) -> reshape -> linear -> reshape",
    "#   -> attention(rank-3) -> take(_, 1, 0) (first-token)",
    "#   -> classifier -> cross_entropy(_, Y)",
    "train 5 { adam(cross_entropy(apply(classifier, take(apply(attn, reshape(apply(linear_p, reshape(patchify(X, 16), [128, 768])), [8, 16, 128])), 1, 0)), Y), [linear_p, attn, classifier], 0.001, 0.9, 0.999, 0.00000001); cross_entropy(apply(classifier, take(apply(attn, reshape(apply(linear_p, reshape(patchify(X, 16), [128, 768])), [8, 16, 128])), 1, 0)), Y) }",
    "all_losses = last_losses",
    "train 5 { adam(cross_entropy(apply(classifier, take(apply(attn, reshape(apply(linear_p, reshape(patchify(X, 16), [128, 768])), [8, 16, 128])), 1, 0)), Y), [linear_p, attn, classifier], 0.001, 0.9, 0.999, 0.00000001); cross_entropy(apply(classifier, take(apply(attn, reshape(apply(linear_p, reshape(patchify(X, 16), [128, 768])), [8, 16, 128])), 1, 0)), Y) }",
    "all_losses = concat(all_losses, last_losses, 0)",
    "train 5 { adam(cross_entropy(apply(classifier, take(apply(attn, reshape(apply(linear_p, reshape(patchify(X, 16), [128, 768])), [8, 16, 128])), 1, 0)), Y), [linear_p, attn, classifier], 0.001, 0.9, 0.999, 0.00000001); cross_entropy(apply(classifier, take(apply(attn, reshape(apply(linear_p, reshape(patchify(X, 16), [128, 768])), [8, 16, 128])), 1, 0)), Y) }",
    "all_losses = concat(all_losses, last_losses, 0)",
