[[demos]]
category = "Generative Models"
name = "GAN (2D circle)"
intro = "A Generative Adversarial Network learning to produce points on a unit circle. WHAT YOU SEE: three scatter plots -- the TARGET (points on the unit circle), the EARLY generator output after only 100 adversarial steps (a smeared blob: the Generator has not yet found the ring), and the TRAINED output after ~3000 steps, which traces the circle. The Generator maps 2D noise to 2D points; the Discriminator scores each point real or fake; they train in alternation with two stabilizers that tiny GANs need: the Discriminator learns at HALF the Generator's rate so its gradients keep flowing, and it sees the real points through a little INSTANCE NOISE (real + 0.03 * randn) so it cannot memorize the 64 exact targets and flatline the game."
takeaway = "The early/trained pair is the honest story: adversarial training does not descend one loss curve, it balances two players, and the intermediate states look like NOISE long after a supervised model of the same size would have converged. What locks the ring in: two hidden layers per player (one layer cannot carve a circular boundary), the slow-Discriminator learning-rate ratio, instance noise on the real batch, and enough alternating steps -- remove any one and some random seeds diverge instead of converging (that IS the GAN stability literature, at toy scale). Check the trained scatter against the target: full ring coverage centered on the origin (no mode collapse), points hugging radius 1."
lines = [
    "n = 64",
    "angles = reshape(range(n), [n, 1]) * 0.0981748             # 64 angles around the circle",
    "real = concat(cos(angles), sin(angles), 1)                 # [64, 2] points ON the unit circle",
    'svg(real, "scatter")                                       # TARGET: the unit circle',
    "G = chain(linear(2, 32, 10), relu_layer(), linear(32, 32, 12), relu_layer(), linear(32, 2, 11))   # Generator: 2D noise -> 2D point (two hidden layers)",
    "D = chain(linear(2, 32, 20), relu_layer(), linear(32, 32, 22), relu_layer(), linear(32, 1, 21))   # Discriminator: point -> real/fake score",
    "z_demo = randn(999, [n, 2])                                # ONE fixed noise batch so early vs trained is apples-to-apples",
    "train 100 { z = randn(step * 7 + 100, [n, 2]) ; dn = randn(step * 3 + 9000, [n, 2]) * 0.03 ; adam(0 - mean(log(sigmoid(apply(D, real + dn)) + 0.0001) + log(1 - sigmoid(apply(D, apply(G, z))) + 0.0001)), D, 0.0005, 0.9, 0.999, 0.00000001) ; adam(0 - mean(log(sigmoid(apply(D, apply(G, z))) + 0.0001)), G, 0.001, 0.9, 0.999, 0.00000001) }",
    'svg(apply(G, z_demo), "scatter")                           # EARLY (100 steps): still a blob -- adversarial training mid-flight',
    "train 2800 { z = randn(step * 13 + 5000, [n, 2]) ; dn = randn(step * 3 + 9000, [n, 2]) * 0.03 ; adam(0 - mean(log(sigmoid(apply(D, real + dn)) + 0.0001) + log(1 - sigmoid(apply(D, apply(G, z))) + 0.0001)), D, 0.0005, 0.9, 0.999, 0.00000001) ; adam(0 - mean(log(sigmoid(apply(D, apply(G, z))) + 0.0001)), G, 0.001, 0.9, 0.999, 0.00000001) }",
    'svg(apply(G, z_demo), "scatter")                           # TRAINED (~3000 steps): the same noise now lands on the ring',
]
[[demos]]
category = "Classification"
name = "Softmax Classifier"
intro = "Three-class classification on 90 blob points. softmax + cross-entropy gradient descent (done in closed form here -- P - Y IS the gradient through the softmax+CE pair), then the usual accuracy / confusion-matrix / decision-boundary close."
takeaway = "A single linear layer with three output heads separates three well-spaced clusters. The decision boundary shows three roughly-wedge-shaped regions, one per class."
lines = [
    "D = blobs(11, 30, [[0, 0], [4, 4], [-4, 4]])                                                                                                                                                                                                                                                  # 90 points in three blobs",
    "X = matmul(D, [[1,0],[0,1],[0,0]])                                                                                                                                                                                                                                                            # drop the label column",
    "tl = reshape(matmul(D, [[0],[0],[1]]), [90])                                                                                                                                                                                                                                                  # integer labels (length 90)",
    "Y = one_hot(tl, 3)                                                                                                                                                                                                                                                                            # one-hot targets [90, 3]",
    "W = zeros([2, 3])                                                                                                                                                                                                                                                                              # 2-input, 3-class weight matrix",
    "b = zeros([3])                                                                                                                                                                                                                                                                                  # per-class bias",
    "lr = 0.2                                                                                                                                                                                                                                                                                       # learning rate",
    "repeat 300 { logits = matmul(X, W) + matmul(ones([90, 1]), reshape(b, [1, 3])); P = softmax(logits, 1); dZ = P - Y; gW = matmul(transpose(X), dZ) / 90; gb = reduce_add(dZ, 0) / 90; W = W - lr * gW; b = b - lr * gb }  # 300 closed-form gradient steps (P-Y is the softmax+CE gradient)",
    "logits = matmul(X, W) + matmul(ones([90, 1]), reshape(b, [1, 3]))                                                                                                                                                                                                                              # final logits",
    "P = softmax(logits, 1)                                                                                                                                                                                                                                                                          # final probabilities",
    "pred = argmax(P, 1)                                                                                                                                                                                                                                                                             # class predictions",
    "accuracy = mean(eq(pred, tl))                                                                                                                                                                                                                                                                   # fraction correct",
    "accuracy                                                                                                                                                                                                                                                                                        # prints close to 1.0",
    "confusion_matrix(pred, tl)                                                                                                                                                                                                                                                                      # 3x3 prediction-vs-actual",
    "G = grid([-6, 6, -3, 6], 30)                                                                                                                                                                                                                                                                   # 30x30 grid in input space",
    "gl = matmul(G, W) + matmul(ones([900, 1]), reshape(b, [1, 3]))                                                                                                                                                                                                                                 # logits over the grid",
    "gP = softmax(gl, 1)                                                                                                                                                                                                                                                                             # per-grid-cell class probabilities",
    "p0 = reshape(matmul(gP, [[1],[0],[0]]), [900])                                                                                                                                                                                                                                                  # extract probability of class 0",
    "boundary_2d(p0, [30, 30], X, tl)                                                                                                                                                                                                                                                                # three-wedge decision surface",
]

[[demos]]
category = "Dim Reduction"
name = "Dim-reduction zoo"
intro = "[[PCA (Principal Component Analysis)]], [[t-SNE]], [[UMAP]], [[Multidimensional Scaling]], and [[Johnson-Lindenstrauss Lemma]] random projection -- five methods on the same 5-D three-cluster dataset, rendered as a row of five scatter plots for direct comparison."
takeaway = "PCA is the cheap linear baseline that preserves the global axes of variance -- clusters land along PC1/PC2 directions. t-SNE inflates each cluster to roughly equal radius, sharpening local boundaries at the cost of global distance. UMAP keeps both: tight clusters AND the relative positions of those clusters in the original 5-D feature space. MDS preserves pairwise distances directly (the answer to 'which points are far from which?'). Random projection is the JL sanity baseline -- a Gaussian random matrix preserves all pairwise distances within a (1 +- eps) factor by sheer probability, no optimization needed; if a learned method does not beat random projection, the learned features are not adding signal."
lines = [
    "# Three 5-D Gaussian clusters at distinct locations.",
    "pts_a = randn(1, [25, 5]) * 0.4 + matmul(ones([25, 1]), [[0, 0, 0, 0, 0]])",
    "pts_b = randn(2, [25, 5]) * 0.4 + matmul(ones([25, 1]), [[3, 3, 0, 0, 0]])",
    "pts_c = randn(3, [25, 5]) * 0.4 + matmul(ones([25, 1]), [[0, 0, 3, 3, 3]])",
    "X = concat(concat(pts_a, pts_b, 0), pts_c, 0)                                       # 75 x 5",
    "labels = concat(concat(zeros([25]), ones([25]), 0), ones([25]) + 1, 0)",
    "# Linear baseline.",
    "pca_proj = pca(X, 2)",
    "# Local-only neighborhood projection.",
    "tsne_proj = tsne(X, 8, 150, 1)",
    "# Local + global projection.",
    "umap_proj = umap(X, 8, 0.1, 150, 1)",
    "# Preserves pairwise distances directly.",
    "mds_proj = mds(X, 2, 80, 1)",
    "# Johnson-Lindenstrauss random-projection sanity baseline.",
    "rp_proj = random_projection(X, 2, 7)",
    "scatter_labeled(pca_proj, labels)",
    "scatter_labeled(tsne_proj, labels)",
    "scatter_labeled(umap_proj, labels)",
    "scatter_labeled(mds_proj, labels)",
    "scatter_labeled(rp_proj, labels)",
]

[[demos]]
category = "Dim Reduction"
name = "UMAP vs PCA"
intro = "Two-moons in 2-D, embedded in 5-D with three low-variance noise dimensions, then projected back to 2-D by both [[PCA (Principal Component Analysis)]] (linear) and [[UMAP]] (non-linear / manifold-aware). PCA picks the top two axes of variance; UMAP builds a k-NN graph over the full 5-D distances and runs SGD on the fuzzy simplicial set with `a, b` curve params fitted from `min_dist`."
takeaway = "PCA reconstructs the moon arcs because the noise dimensions carry less variance than the moons themselves -- you can see crescents along PC1/PC2. UMAP recovers the two moons from local neighborhood structure: class 0 lands in one region of the embedding, class 1 in the other, with minimal cross-mixing -- a different recipe for the same end result. The legend in each scatter maps integer class id to color: 0 = blue, 1 = pink."
lines = [
    "# Two-moons (100 points, light noise) is the test bed.",
    "M = moons(7, 100, 0.05)                                            # 100 x 3: x, y, label",
    "moons2d = matmul(M, [[1, 0], [0, 1], [0, 0]])                       # drop label column",
    "labels = reshape(matmul(M, [[0], [0], [1]]), [100])                # integer labels",
    "# Embed in 5-D with three low-variance noise dimensions.",
    "embed = randn(42, [100, 3]) * 0.3",
    "X = concat(moons2d, embed, 1)                                      # 100 x 5",
    "# PCA: top 2 linear principal components.",
    "pca_proj = pca(X, 2)",
    "# UMAP: k-NN graph + fuzzy simplicial set + layout SGD.",
    "umap_proj = umap(X, 15, 0.1, 200, 7)                                # n_neighbors, min_dist, iters, seed",
    "# Side by side, colored by class.",
    "scatter_labeled(pca_proj, labels)",
    "scatter_labeled(umap_proj, labels)",
]

[[demos]]
category = "Dim Reduction"
name = "UMAP vs t-SNE"
intro = "Three clusters in 4-D where cluster 2 is five times farther from clusters 0 and 1 than cluster 0 is from cluster 1. The legend in each scatter maps integer class id to color: 0 = blue (origin), 1 = pink (near), 2 = green (far). Both [[t-SNE]] and [[UMAP]] use a fuzzy-graph view of local neighborhoods, but they handle GLOBAL inter-cluster distance differently. The comparison shows what t-SNE drops and UMAP keeps."
takeaway = "t-SNE tends to inflate every cluster to a similar size, washing out 'cluster 2 is much farther than 0 is from 1.' UMAP's repulsive force keeps the relative distances readable -- cluster 2 (green) ends up clearly farther from {0, 1} than 0 is from 1. The structural reason: t-SNE's KL objective is purely local (it normalizes per row), while UMAP's cross-entropy + negative-sampling objective lets the repulsive term carry global signal."
lines = [
    "# Three 4-D Gaussian clusters: A at origin, B near A, C 5x farther.",
    "pts_a = randn(1, [30, 4]) * 0.5 + matmul(ones([30, 1]), [[0, 0, 0, 0]])",
    "pts_b = randn(2, [30, 4]) * 0.5 + matmul(ones([30, 1]), [[3, 0, 0, 0]])",
    "pts_c = randn(3, [30, 4]) * 0.5 + matmul(ones([30, 1]), [[15, 0, 0, 0]])",
    "X = concat(concat(pts_a, pts_b, 0), pts_c, 0)                                       # 90 x 4",
    "labels = concat(concat(zeros([30]), ones([30]), 0), ones([30]) + 1, 0)              # 30 zeros, 30 ones, 30 twos",
    "# t-SNE: perplexity-calibrated local KL, no global anchor.",
    "tsne_proj = tsne(X, 10, 200, 1)",
    "# UMAP: fuzzy simplicial set + cross-entropy with negative sampling.",
    "umap_proj = umap(X, 10, 0.1, 200, 1)",
    "scatter_labeled(tsne_proj, labels)",
    "scatter_labeled(umap_proj, labels)",
]

[[demos]]
category = "Language Models"
name = "Tiny LM Generate"
intro = "End-to-end tiny transformer language model: tokenize a small corpus with BPE, wrap inputs as next-token pairs, build a 1-layer model (embed + causal_attention + rms_norm + linear head), train 30 [[Adam]] steps, then sample 20 tokens from a prompt and render the attention heatmap. The smallest program that trains and generates text."
takeaway = "A language model with a few thousand parameters produced a decoded string from a learned distribution and a [T,T] heatmap of what each position attended to. The loss curve should trend downward; the generated text is noisy because the model and budget are both tiny -- scale V, d, block, and step count for a serious run via the CLI."
lines = [
    'corpus = load_preloaded("tiny_corpus")                                                                                                                                                                                                                                                          # short pangram-style training corpus',
    "tok    = train_bpe(corpus, 260, 0)                                                                                                                                                                                                                                                                # train a 260-token BPE tokenizer",
    "ids    = apply_tokenizer(tok, corpus)                                                                                                                                                                                                                                                              # encode corpus -> integer ids",
    "X_all = shift_pairs_x(ids, 8)                                                                                                                                                                                                                                                                       # next-token input windows of length 8",
    "Y_all = shift_pairs_y(ids, 8)                                                                                                                                                                                                                                                                       # matching target windows shifted by 1",
    "X     = reshape(X_all, [reduce_mul(shape(X_all))])                                                                                                                                                                                                                                                  # flatten to 1-D for the embed lookup",
    "Y     = reshape(Y_all, [reduce_mul(shape(Y_all))])                                                                                                                                                                                                                                                  # flatten targets",
    "V = 260 ; d = 16 ; h = 1                                                                                                                                                                                                                                                                            # vocab / embed-dim / heads",
    "model = chain(embed(V, d, 0), causal_attention(d, h, 1), rms_norm(d), linear(d, V, 2))                                                                                                                                                                                                              # 1-layer transformer LM",
    'experiment "tiny_lm_gen" { train 30 { adam(cross_entropy(apply(model, X), Y), model, 0.01, 0.9, 0.999, 0.00000001); loss_metric = cross_entropy(apply(model, X), Y) } }  # train 30 Adam steps; record per-step loss',
    "loss_curve(last_losses)                                                                                                                                                                                                                                                                             # plot the training loss",
    "perplexity(apply(model, X), Y)                                                                                                                                                                                                                                                                       # exp(CE) -- canonical LM metric (lower is better)",
    'prompt = apply_tokenizer(tok, "the ")                                                                                                                                                                                                                                                              # seed prompt as token ids',
    "seq    = prompt                                                                                                                                                                                                                                                                                      # generation buffer",
    "repeat 20 { logits = apply(model, seq); last = last_row(logits); nxt = sample(top_k(last, 20), 0.8, step); seq = concat(seq, nxt) }                                                                                                                                                                  # 20-token sample with top-k 20 + temperature 0.8",
    "decode(tok, seq)                                                                                                                                                                                                                                                                                     # decode ids back to text",
    'viz_ids = apply_tokenizer(tok, "the quick")                                                                                                                                                                                                                                                          # short input for the heatmap',
    "attn_w  = attention_weights(model, viz_ids)                                                                                                                                                                                                                                                          # extract the [T, T] attention weights",
    'svg(attn_w, "heatmap")                                                                                                                                                                                                                                                                              # what each position attended to',
]

