    "reduce_add(m, 0)                   # column sums (length 4)",
    "reduce_add(m, 1)                   # row sums (length 3)",
]

[[demos]]
category = "Classification"
name = "Moons MLP"
intro = "A two-layer tanh MLP trained with [[Adam]] + cross-entropy on the 'two moons' synthetic dataset -- two interleaved half-circles that a single linear classifier can't separate. 200 training steps, then accuracy, a loss curve, a confusion matrix, and the learned decision boundary over a 30x30 grid."
takeaway = "A non-linear classifier with ~50 parameters separates the moons. cross_entropy(logits, y) is the canonical classification loss and is differentiable end-to-end through grad. The boundary SVG curves around each moon -- a visual proof that a hidden layer plus a non-linearity learned a non-linear decision surface."
lines = [
    "M = moons(7, 120, 0.08)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # 120 points in two interleaved half-circles",
    "X = matmul(M, [[1,0],[0,1],[0,0]])                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # drop the label column",
    "y = reshape(matmul(M, [[0],[0],[1]]), [120])                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        # extract integer labels",
    "O120 = ones([120, 1])                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # ones-column for bias broadcasting",
    "W1 = param[2, 8]                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # input -> hidden weight matrix (declares trainable)",
    "b1 = param[1, 8]                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # hidden bias",
    "W2 = param[8, 2]                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # hidden -> output weights",
    "b2 = param[1, 2]                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # output bias",
    "W1 = randn(11, [2, 8]) * 0.5                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        # initialize W1 with seeded normal",
    "W2 = randn(12, [8, 2]) * 0.5                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        # initialize W2 with seeded normal",
    "train 200 { adam(cross_entropy(matmul(tanh_fn(matmul(X, W1) + matmul(O120, b1)), W2) + matmul(O120, b2), y), [W1, b1, W2, b2], 0.05, 0.9, 0.999, 0.00000001); cross_entropy(matmul(tanh_fn(matmul(X, W1) + matmul(O120, b1)), W2) + matmul(O120, b2), y) }  # 200 Adam steps with cross-entropy loss",
    "Z1 = matmul(X, W1) + matmul(O120, b1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # forward: hidden pre-activation",
    "H = tanh_fn(Z1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    # hidden activation",
    "Z2 = matmul(H, W2) + matmul(O120, b2)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # output pre-activation",
    "P = softmax(Z2, 1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # row-wise probabilities",
    "pred = argmax(P, 1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                # discrete class predictions",
    "accuracy = mean(eq(pred, y))                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       # fraction correct",
    "accuracy                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            # prints close to 1.0",
    "loss_curve(last_losses)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            # train block auto-captured per-step losses",
    "confusion_matrix(pred, y)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # 2x2 prediction-vs-actual",
    "G = grid([-1.5, 2.5, -1, 1.5], 30)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # 30x30 grid in input space",
    "O900 = ones([900, 1])                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # broadcast helper for grid bias",
    "GZ1 = matmul(G, W1) + matmul(O900, b1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # grid forward: hidden pre-activation",
    "GH = tanh_fn(GZ1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  # grid hidden activation",
    "GZ2 = matmul(GH, W2) + matmul(O900, b2)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              # grid output pre-activation",
    "GP = softmax(GZ2, 1)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                # grid probabilities",
    "p1 = reshape(matmul(GP, [[0],[1]]), [900])                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          # extract probability of class 1",
    "boundary_2d(p1, [30, 30], X, y)                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      # render the curved decision surface",
]

[[demos]]
category = "Classical ML"
name = "Naive Bayes (Gaussian)"
intro = "A generative classifier with NO training loop: fit per-class feature means and variances with two masked matmuls, then classify by argmax over summed log-densities (Bayes' rule with the 'naive' independence assumption). Same two-moons data the Moons MLP demo trains on -- so you can see what the Gaussian assumption buys and what it costs. The probability-surface heatmap shows the smooth quadratic boundary NB draws; the accuracy line shows it scoring ~0.85 where the MLP reaches ~1.0."
takeaway = "Generative vs discriminative on one dataset: Naive Bayes MODELS each class as a Gaussian cloud (closed-form fit, instant, stable -- train and test accuracy nearly identical because there is nothing to overfit) and gets a smooth boundary that misses the crescent tips; the Moons MLP LEARNS whatever boundary the data demands and nails them. Neither is 'better' -- one buys speed and calibration from assumptions, the other buys flexibility with gradient descent. This is the book chapter 'Naive Bayes' as six array expressions."
lines = [
    "M = moons(7, 100, 0.2)                          # two crescents, 100 labeled points -- the Moons MLP demo's dataset",
    'svg(M, "scatter")                               # the training data, colored by TRUE label',
    "X = matmul(M, [[1, 0], [0, 1], [0, 0]]) ; Y = take(transpose(M), 0, 2)  # features [100, 2] and labels [100]",
    "mask = one_hot(Y, 2) ; counts = reduce_add(mask, 0)  # class masks -> per-class counts [50, 50]",
    "mu = matmul(transpose(mask), X) / matmul(reshape(counts, [2, 1]), fill([1, 2], 1))  # per-class feature MEANS: one masked matmul, no loop",
    "s2 = matmul(transpose(mask), X * X) / matmul(reshape(counts, [2, 1]), fill([1, 2], 1)) - mu * mu + 0.001  # per-class VARIANCES (E[x^2] - mu^2, floored for the log)",
    "prior = counts / 100                             # class priors -- that is the ENTIRE fit; [[Naive Bayes]] has no training loop",
    "def u:loglik(P, c) {\n    \"log P(points | class c) + log prior, vectorized over all points\";\n    n = take(shape(P), 0, 0);\n    # broadcast class-c mean and variance to every point (outer product with ones)\n    MU = matmul(fill([n, 1], 1), reshape(take(mu, 0, c), [1, 2]));\n    S2 = matmul(fill([n, 1], 1), reshape(take(s2, 0, c), [1, 2]));\n    # Gaussian log-density summed over the 2 features, plus the class prior\n    reduce_add(0 - 0.5 * log(2 * 3.141592653589793 * S2) - (P - MU) * (P - MU) / (2 * S2), 1) + log(take(prior, 0, c))\n}  # Gaussian log-density + log prior, vectorized over points",
    "T = moons(8, 60, 0.2) ; Xte = matmul(T, [[1, 0], [0, 1], [0, 0]]) ; Yte = take(transpose(T), 0, 2)  # 60 FRESH points",
    "pred = gt(u:loglik(Xte, 1), u:loglik(Xte, 0))    # Bayes' rule: pick the class with the higher posterior",
    "concat(reshape(mean(eq(pred, Yte)), [1]), reshape(mean(eq(gt(u:loglik(X, 1), u:loglik(X, 0)), Y)), [1]), 0)  # [test accuracy, train accuracy] -- nearly equal: nothing to overfit",
    "GX = matmul(fill([40, 1], 1), reshape(linspace(0 - 1.5, 2.5, 40), [1, 40])) ; GY = matmul(reshape(linspace(1.5, 0 - 1.0, 40), [40, 1]), fill([1, 40], 1)) ; grid = concat(reshape(GX, [1600, 1]), reshape(GY, [1600, 1]), 1)  # a 40x40 grid over the plane",
    'svg(reshape(sigmoid(u:loglik(grid, 1) - u:loglik(grid, 0)), [40, 40]), "heatmap")  # P(class 1) over the plane -- the smooth boundary the Gaussian assumption draws',
    'svg(concat(Xte, reshape(pred, [60, 1]), 1), "scatter")  # test points colored by PREDICTED label',
]

[[demos]]
category = "Dim Reduction"
name = "PCA"
intro = "Principal Component Analysis without calling into a library: make anisotropic 2D data, center it, form the covariance matrix, run [[power iteration]] to find the top eigenvector, and project every point onto it. The top axis is the direction of maximum variance."
takeaway = "The scatter is colored by which side of zero each point's projection lands on; the line shows the found principal axis. Power iteration converges in ~10 steps to a direction that's clearly the long axis of the data cloud."
lines = [
    "Xraw = randn(1, [60, 2])                                          # 60 points of isotropic 2D noise",
    "X = matmul(Xraw, [[1, 2], [0, 0.3]])                              # stretch into an anisotropic cloud",
    "cm = reduce_add(X, 0) / 60                                        # column means -- the centroid",
    "Xc = X - matmul(ones([60, 1]), reshape(cm, [1, 2]))               # center the data",
    "Cov = matmul(transpose(Xc), Xc) / 60                              # 2x2 covariance matrix",
    "v = [1, 0]                                                         # initial guess for the top eigenvector",
    "repeat 10 { v = matmul(Cov, v); v = v / sqrt(dot(v, v)) }         # power iteration: 10 multiplies + normalize",
    "coords = reshape(matmul(Xc, reshape(v, [2, 1])), [60])            # project each point onto the principal axis",
    "labels = gt(coords, 0)                                             # which side of the axis each point lands on",
    "ends = matmul(reshape([-3, 3], [2, 1]), reshape(v, [1, 2]))       # endpoints of the axis line in centered space",
    "line = ends + matmul(ones([2, 1]), reshape(cm, [1, 2]))           # shift the line back into original space",
    "scatter_labeled(X, labels)                                         # data colored by side of the principal axis",
    'svg(line, "line")                                                 # the principal axis itself',
]

[[demos]]
category = "Dim Reduction"
name = "PCA 3D (interactive)"
intro = 'Three 5-D Gaussian clusters projected to their top three principal components and rendered as an interactive [[PCA (Principal Component Analysis)]] viewer via the new `svg(_, "plotly3d", labels)` viz type. Drag to rotate, scroll to zoom, double-click to reset. Click any point and the browser console logs which sample + cluster it belongs to (the click handler is wired but the REPL panel hookup is a follow-up step).'
takeaway = "Three well-separated clusters fall into three corners of the 3D PCA embedding. Unlike the static 2D `scatter_labeled` rendering, you can rotate to confirm the separation holds along every axis -- the answer to the user question 'are these clusters actually distinct, or is the projection hiding overlap?'. The plot is driven by Plotly via a self-contained HTML/JS payload returned from the new viz type; integrates the existing `pca` builtin without further plumbing."
lines = [
    "# Build 90 noisy points in 5-D from three cluster centers.",
    "# `blobs` only supports 2-D, so we hand-roll the construction",
    "# via randn + broadcasted centers + concat.",
    "center_a = [0, 0, 0, 0, 0]",
    "center_b = [5, 5, 5, 5, 5]",
    "center_c = [-5, 5, -5, 5, -5]",
    "noise = 0.5",
    "pts_a = randn(1, [30, 5]) * noise + matmul(ones([30, 1]), reshape(center_a, [1, 5]))",
    "pts_b = randn(2, [30, 5]) * noise + matmul(ones([30, 1]), reshape(center_b, [1, 5]))",
    "pts_c = randn(3, [30, 5]) * noise + matmul(ones([30, 1]), reshape(center_c, [1, 5]))",
    "X = concat(concat(pts_a, pts_b, 0), pts_c, 0)                                # 90 x 5",
    "tl = concat(concat(zeros([30]), ones([30]), 0), ones([30]) + 1, 0)            # cluster labels: 30 zeros, 30 ones, 30 twos",
    "# Project the 5-D data onto its top 3 principal components.",
    "P = pca(X, 3)                                                                  # 90 x 3",
    "# Interactive 3D scatter. Drag = rotate, scroll = zoom, click = identify sample.",
    'svg(P, "plotly3d", tl)',
]

[[demos]]
category = "Dim Reduction"
name = "PCA loadings (critical dimensions)"
intro = """Same three-cluster 5-D dataset as the PCA 3D demo, but instead of plotting the projected points we plot the LOADINGS -- the directions in original feature space that each principal component aligns with. This is the [[PCA (Principal Component Analysis)]] answer to 'which input dimensions matter?'. The new `pca_components(X, k)` builtin returns the `[k, D]` loadings matrix; the new `pca_variance_explained(X, k)` builtin returns the per-component variance fractions. The `svg(_, "critical_dimensions", _)` viz renders both as a heatmap with PC labels."""
takeaway = "Each row is one principal component (PC1, PC2, PC3); each column is one input dimension (0..4). Bright cells = features that dominate that component; dark cells = features that contribute little. With three well-separated clusters in 5-D, the top two components usually capture >90% of the variance (see the per-row percentages on the right) and pull from a handful of features each. The same `critical_dimensions` viz will be reused in the dim-reduction milestone for UMAP / t-SNE permutation-sensitivity heatmaps once those land."
lines = [
    "# Same 5-D cluster build as the PCA 3D demo.",
    "center_a = [0, 0, 0, 0, 0]",
    "center_b = [5, 5, 5, 5, 5]",
    "center_c = [-5, 5, -5, 5, -5]",
    "noise = 0.5",
    "pts_a = randn(1, [30, 5]) * noise + matmul(ones([30, 1]), reshape(center_a, [1, 5]))",
    "pts_b = randn(2, [30, 5]) * noise + matmul(ones([30, 1]), reshape(center_b, [1, 5]))",
    "pts_c = randn(3, [30, 5]) * noise + matmul(ones([30, 1]), reshape(center_c, [1, 5]))",
    "X = concat(concat(pts_a, pts_b, 0), pts_c, 0)",
    "# Top-3 principal-component LOADINGS (directions in original 5-D feature space).",
    "V = pca_components(X, 3)                                          # [3, 5]",
    "# Per-component variance-explained ratios.",
    "ve = pca_variance_explained(X, 3)                                 # [3]",
    "# Critical-dimensions heatmap with per-row variance percentages.",
    'svg(V, "critical_dimensions", ve)',
