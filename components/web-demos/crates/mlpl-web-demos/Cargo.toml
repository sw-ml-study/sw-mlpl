[package]
name = "mlpl-web-demos"
edition.workspace = true
license.workspace = true
version.workspace = true
build = "build.rs"

[lib]
name = "mlpl_web_demos"
path = "src/lib.rs"

# Regenerates work/reg-rs/web-demos/*.mlpl (with doc headers) from the
# DEMOS registry. Invoked by scripts/gen-web-demos.sh.
[[bin]]
name = "gen-web-demos"
path = "src/bin/gen_web_demos.rs"

[dependencies]
mlpl-web-demos-types = { path = "../mlpl-web-demos-types" }

# build.rs reads demos.toml and generates the DEMOS const into OUT_DIR, so the
# demo prose + MLPL lines live in data, not Rust source. Build-only -- not in
# the wasm bundle.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# No heavy dev-deps: the demo-eval smoke test (which needs the interpreter)
# lives in the sibling `mlpl-web-demos-smoke` crate, so the metadata tests
# here compile without rebuilding mlpl-eval. See docs/modular-build.md.
[dev-dependencies]
