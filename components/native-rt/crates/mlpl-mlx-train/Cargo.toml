[package]
# Saga local-gpu-agentic step 005 (approach A): MLX on-device
# training primitives -- autodiff via mlx_rs `value_and_grad` plus an
# on-device Adam optimizer. Sibling to the forward-only `mlpl-mlx-rt`
# ("refactor up and out": training is a distinct concern, its own
# crate). Apple-Silicon only; gated like mlpl-mlx-rt so the crate
# stays cross-platform-buildable (exports nothing off-target).
name = "mlpl-mlx-train"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
mlx = ["dep:mlx-rs"]

[dependencies]
mlx-rs = { version = "=0.25.3", optional = true, default-features = false, features = [
  "accelerate",
  "metal",
] }
