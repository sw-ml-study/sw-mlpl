[package]
# Saga cuda-foundation step 003: CUDA nn op surface (activations,
# reductions, softmax/cross_entropy) -- the candle analog of
# mlpl-mlx-rt's activations + reductions. Sibling of mlpl-cuda-rt in
# the cuda-rt workspace. Linux/x86_64 + the `cuda` feature gate
# everything; off-target the crate exports nothing.
name = "mlpl-cuda-nn"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
cuda = ["dep:candle-core", "dep:candle-nn", "mlpl-cuda-rt/cuda"]

[dependencies]
mlpl-array = { path = "../../../array/crates/mlpl-array" }
mlpl-cuda-rt = { path = "../mlpl-cuda-rt" }
# CPU fallback for reduce_mul (candle has no prod reduction) -- the
# op is low-value on the GPU, so it delegates to the CPU runtime.
mlpl-rt = { path = "../../../native-rt/crates/mlpl-rt" }

# Target-gated so non-Linux `--features cuda` builds stub cleanly
# (cudarc needs nvcc at build time). See mlpl-cuda-rt/Cargo.toml.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
candle-core = { version = "0.9", optional = true, default-features = false, features = [
  "cuda",
] }
candle-nn = { version = "0.9", optional = true, default-features = false, features = [
  "cuda",
] }

[lints]
workspace = true
