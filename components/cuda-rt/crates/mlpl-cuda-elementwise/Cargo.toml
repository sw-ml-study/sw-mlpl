[package]
# Saga cuda-foundation step 002: CUDA elementwise primitives, the
# candle analog of `mlpl-mlx-rt::elementwise`. A sibling of
# `mlpl-cuda-rt` (not a module of it) so each crate stays within the
# module/function budgets. Reuses cuda-rt's device + conversion
# plumbing. Linux/x86_64 + the `cuda` feature gate everything.
name = "mlpl-cuda-elementwise"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
cuda = ["dep:candle-core", "dep:candle-nn", "mlpl-cuda-rt/cuda"]

[dependencies]
mlpl-array = { path = "../../../array/crates/mlpl-array" }
mlpl-cuda-rt = { path = "../mlpl-cuda-rt" }

# Target-gated so non-Linux `--features cuda` builds stub cleanly
# (cudarc needs nvcc at build time). See mlpl-cuda-rt/Cargo.toml.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
candle-core = { version = "0.9", optional = true, default-features = false, features = [
  "cuda",
] }
candle-nn = { version = "0.9", optional = true, default-features = false, features = [
  "cuda",
] }

[dev-dependencies]
# Activation parity reference: the CPU DenseArray ops in mlpl-rt.
mlpl-rt = { path = "../../../native-rt/crates/mlpl-rt" }

[lints]
workspace = true
