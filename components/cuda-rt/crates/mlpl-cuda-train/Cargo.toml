[package]
# Saga cuda-foundation: CUDA on-device training kernel -- candle
# autodiff (loss_and_grads) + a stateless Adam update (adam_update)
# with moment buffers as candle Tensors. The candle "approach A"
# analog of mlpl-mlx-train. Linux/x86_64 + the `cuda` feature gate
# everything; off-target the crate exports nothing.
name = "mlpl-cuda-train"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = []
cuda = ["dep:candle-core"]

[dependencies]
candle-core = { version = "0.9", optional = true, default-features = false, features = [
  "cuda",
] }

[lints]
workspace = true
