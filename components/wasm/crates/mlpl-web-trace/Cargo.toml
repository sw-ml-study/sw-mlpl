[package]
name = "mlpl-web-trace"
edition.workspace = true
license.workspace = true
version.workspace = true

# Spike step 015: the generation-keyed live-trace stores
# (telemetry, frames), the numeric-output summarizer, and the
# connect-mode fetchers (stats, ollama, viz) -- everything that
# observes a running eval without being the eval transport.

[lib]
name = "mlpl_web_trace"
path = "src/lib.rs"

[dependencies]
mlpl-web-eval-core = { path = "../mlpl-web-eval-core" }
mlpl-monitor-types = { path = "../../../monitoring/crates/mlpl-monitor-types" }
mlpl-web-viz-ir = { path = "../../../web-viz-ir/crates/mlpl-web-viz-ir" }
mlpl-web-viz3d = { path = "../../../web-viz3d/crates/mlpl-web-viz3d" }
gloo = { version = "0.11", features = ["net", "timers", "futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "console"] }
