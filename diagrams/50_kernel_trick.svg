<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" style="background-color:white;font-family:'trebuchet ms',verdana,arial,sans-serif;font-size:12px">
  <text x="300" y="22" text-anchor="middle" font-size="16" font-weight="bold">The kernel trick: separate by adding a dimension</text>

  <!-- 1D: not separable -->
  <g transform="translate(70,80)">
    <text x="230" y="-16" text-anchor="middle" font-weight="bold">1D input: no single threshold separates red from blue</text>
    <line x1="0" y1="0" x2="460" y2="0" stroke="#374151" stroke-width="2"/>
    <circle cx="30" cy="0" r="7" fill="#3b82f6"/><circle cx="70" cy="0" r="7" fill="#3b82f6"/><circle cx="110" cy="0" r="7" fill="#3b82f6"/>
    <circle cx="180" cy="0" r="7" fill="#ef4444"/><circle cx="215" cy="0" r="7" fill="#ef4444"/><circle cx="250" cy="0" r="7" fill="#ef4444"/><circle cx="285" cy="0" r="7" fill="#ef4444"/>
    <circle cx="350" cy="0" r="7" fill="#3b82f6"/><circle cx="395" cy="0" r="7" fill="#3b82f6"/><circle cx="435" cy="0" r="7" fill="#3b82f6"/>
    <text x="230" y="26" text-anchor="middle" font-family="monospace" font-size="11">x</text>
  </g>

  <!-- map arrow -->
  <line x1="300" y1="120" x2="300" y2="158" stroke="#15803d" stroke-width="2.5"/>
  <path d="M300,158 l-5,-10 l10,0 z" fill="#15803d"/>
  <text x="312" y="144" fill="#15803d" font-family="monospace">phi(x) = (x, x*x)</text>

  <!-- 2D: separable -->
  <g transform="translate(70,330)">
    <text x="230" y="-158" text-anchor="middle" font-weight="bold">lifted to 2D: the parabola makes a LINE sufficient</text>
    <line x1="0" y1="0" x2="460" y2="0" stroke="#9ca3af"/>
    <line x1="230" y1="0" x2="230" y2="-140" stroke="#9ca3af"/>
    <!-- parabola points: x from -200..200 scaled, y = -x^2/300 -->
    <circle cx="30" cy="-133" r="7" fill="#3b82f6"/><circle cx="70" cy="-85" r="7" fill="#3b82f6"/><circle cx="110" cy="-48" r="7" fill="#3b82f6"/>
    <circle cx="180" cy="-8" r="7" fill="#ef4444"/><circle cx="215" cy="-1" r="7" fill="#ef4444"/><circle cx="250" cy="-1" r="7" fill="#ef4444"/><circle cx="285" cy="-10" r="7" fill="#ef4444"/>
    <circle cx="350" cy="-48" r="7" fill="#3b82f6"/><circle cx="395" cy="-91" r="7" fill="#3b82f6"/><circle cx="435" cy="-140" r="7" fill="#3b82f6"/>
    <line x1="0" y1="-30" x2="460" y2="-30" stroke="#15803d" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="60" y="-38" fill="#15803d" font-size="11" font-weight="bold">separating line</text>
    <text x="230" y="20" text-anchor="middle" font-family="monospace" font-size="11">(x, x*x)</text>
  </g>

  <text x="300" y="368" text-anchor="middle">Kernels compute inner products in the lifted space without building it;</text>
  <text x="300" y="386" text-anchor="middle">at whiteboard scale, build it explicitly: concat(X, X * X, 1) -- then a linear model suffices.</text>
</svg>
